# ============================================================================
# curl-rs-ffi/cbindgen.toml
# ----------------------------------------------------------------------------
# cbindgen 0.29.2 configuration for generating a C header from the curl-rs-ffi
# crate's `extern "C"` / `#[no_mangle]` / `#[repr(C)]` items. The generated
# header targets curl's public ABI; the behavioral/ABI oracle is the EXISTING
# curl `include/curl/curl.h` (8.19.0-DEV).
#
# REGENERATED HEADER + CURATED RECONCILIATION WORKFLOW
# ----------------------------------------------------
# AAP §0.4 / §0.5.2 require the public headers to stay synchronized with the FFI
# implementation via cbindgen. This config drives that regeneration/verification
# step from `build.rs`, while the published `include/curl/*.h` files remain the
# reviewed ABI contract after reconciliation. That reconciliation step is
# required because cbindgen cannot reproduce several libcurl header constructs:
#   * the 8-header split -- the curated curl.h aggregates easy.h, multi.h,
#     urlapi.h, websockets.h, options.h, header.h and mprintf.h, whereas
#     cbindgen emits ONE consolidated header;
#   * the C-variadic signatures of curl_easy_setopt / curl_easy_getinfo /
#     curl_multi_setopt -- the Rust shims are non-variadic on stable Rust
#     (no `c_variadic`), so cbindgen emits them WITHOUT the `...` ellipsis;
#   * the exact CURLcode integer enumeration, the CURL_TEMP_PRINTF
#     format-check macro (mprintf.h), the typecheck-gcc.h wrappers, and the
#     compile-time deprecation macros.
# Where generated output diverges from the reviewed headers, maintainers must
# reconcile the generated declaration against the curl oracle signatures and keep
# the ABI-correct curated form (for example variadic ellipses and split-header
# aggregation). This config is tuned to match curl's house style so the generated
# header diffs as closely as possible against the curated curl.h and can be used
# for verification/diffing and explicit, maintainer-driven regeneration.
# ============================================================================

# ----------------------------------------------------------------------------
# Top-level language / style settings.
# ----------------------------------------------------------------------------
# curl's public API is C, not C++.
language = "C"

# curl uses classic include guards, NOT `#pragma once`.
pragma_once = false

# Match the master header's guard exactly: curl.h opens `#ifndef CURLINC_CURL_H`.
include_guard = "CURLINC_CURL_H"

# Emit the `#ifdef __cplusplus` / `extern "C" { ... }` wrapper that every curl
# header carries (curl.h:L105-107).
cpp_compat = true

# "tag" style: structs render as `struct curl_slist { ... }` and are referenced
# as `struct curl_slist *`, exactly as curl declares them -- curl never
# typedefs its public structs. (Verified: "both" emits an extra
# `typedef struct curl_slist { ... } curl_slist;` that curl does NOT have and
# therefore diverges; "tag" minimizes the diff against the curated curl.h.)
# Typedef'd enums (`typedef enum { ... } CURLcode;`) instead render as
# `enum CURLcode { ... }` under "tag" -- a known divergence reconciled in favor
# of the curated header (see the [enum] section); the ABI-critical integer
# values remain exact.
style = "tag"

# Preserve the doc comments curl ships in its headers. They are part of the
# published header and are harmless to the ABI.
documentation = true
documentation_style = "c"

# curl house style: 2-space indent, ~79-column lines (see .editorconfig:
# `[*.{c,h}] indent_size = 2` / `max_line_length = 79`). Keeping this minimizes
# the diff against the curated header.
line_length = 79
tab_width = 2

# Render Rust `usize` as `size_t` rather than cbindgen's default `uintptr_t`.
# curl's public headers use `size_t` pervasively (108 occurrences across
# include/curl/*.h, e.g. `struct curl_blob { ...; size_t len; ... }` in
# easy.h:L34) and NEVER use `uintptr_t` (0 occurrences). The two are
# ABI-identical in width on every supported platform, but `size_t` matches
# curl's house style and minimizes the textual diff against the curated header.
usize_is_size_t = true

# ----------------------------------------------------------------------------
# License banner + autogenerated-file warning.
# ----------------------------------------------------------------------------
# Exact curl SPDX license block, copied verbatim from the top of
# include/curl/curl.h and ending with `SPDX-License-Identifier: curl`. A TOML
# multi-line *literal* string ('''...''') is used so the ASCII-art backslashes
# and the embedded double quotes are preserved without escaping. This keeps the
# generated header license-compliant and aligned with every curl public header.
header = '''
/***************************************************************************
 *                                  _   _ ____  _
 *  Project                     ___| | | |  _ \| |
 *                             / __| | | | |_) | |
 *                            | (__| |_| |  _ <| |___
 *                             \___|\___/|_| \_\_____|
 *
 * Copyright (C) Daniel Stenberg, <daniel@haxx.se>, et al.
 *
 * This software is licensed as described in the file COPYING, which
 * you should have received as part of this distribution. The terms
 * are also available at https://curl.se/docs/copyright.html.
 *
 * You may opt to use, copy, modify, merge, publish, distribute and/or sell
 * copies of the Software, and permit persons to whom the Software is
 * furnished to do so, under the terms of the COPYING file.
 *
 * This software is distributed on an "AS IS" basis, WITHOUT WARRANTY OF ANY
 * KIND, either express or implied.
 *
 * SPDX-License-Identifier: curl
 *
 ***************************************************************************/'''

# Clear marker that the generated header is machine-produced and must be
# reconciled with the reviewed public headers before publication.
autogen_warning = """
/*
 * DO NOT EDIT: autogenerated by cbindgen from the curl-rs-ffi crate. The
 * published include/curl/*.h headers are regenerated by reconciling this output
 * against curl's oracle signatures; keep the ABI-correct curated declaration
 * whenever cbindgen cannot express a libcurl construct (for example variadics).
 */"""

# ----------------------------------------------------------------------------
# Injected includes.
# ----------------------------------------------------------------------------
# curl.h pulls curlver.h + system.h (curl.h:L62-63); these define the
# LIBCURL_VERSION* macros, curl_off_t, curl_socklen_t, etc. cbindgen cannot
# model curl's include aggregation, so inject them explicitly after the
# auto-generated standard includes.
after_includes = "\n#include \"curlver.h\"\n#include \"system.h\""

# The C standard headers curl.h relies on (FILE, size_t, time_t, ...). Mirrors
# curl.h:L65-75 (stdio.h, limits.h, sys/types.h, time.h). Tune to what the
# generated declarations actually reference.
sys_includes = ["stdio.h", "limits.h", "time.h", "sys/types.h"]

# No extra local headers beyond `after_includes`. `no_includes` is deliberately
# NOT set: cbindgen's auto-added standard includes together with the injected
# curl headers above are required.
includes = []

# NOTE: the curated curl.h additionally APPENDS, at the very END of the file,
# `#include "easy.h"`, `#include "multi.h"`, `#include "urlapi.h"`,
# `#include "options.h"`, `#include "header.h"`, `#include "websockets.h"` and
# `#include "mprintf.h"` (curl.h:L3314-3320, the master-aggregation behavior).
# cbindgen cannot reproduce this trailing aggregation; the curated/regenerated
# public curl.h provides it during reconciliation.

# ----------------------------------------------------------------------------
# [export] -- control the emitted item set.
# ----------------------------------------------------------------------------
[export]
# Emit the full set of C declarations.
item_types = [
  "constants",
  "globals",
  "enums",
  "structs",
  "unions",
  "typedefs",
  "opaque",
  "functions",
]
# No `prefix`: curl symbols are already prefixed `curl_` / `CURL`.
#
# `exclude` is intentionally omitted here. Add internal helper type names to an
# `exclude = [ ... ]` list ONLY if any accidentally surface, so that ONLY the
# public `curl_*` / `CURL*` API is emitted. The exported FUNCTION set must align
# with lib/libcurl.def (100 `curl_*` symbols) -- the target of the nm/objdump
# symbol-parity gate.

# [export.rename] -- intentionally empty. The opaque handles must render as
# `typedef void CURL;` / `typedef void CURLSH;` exactly (curl.h:L109-110); that
# is achieved by defining them as opaque `c_void` aliases in src/types.rs, NOT
# by a rename here. Add an entry only if a Rust type name must map to a
# different curl C name.
[export.rename]

# ----------------------------------------------------------------------------
# [parse] -- which crates cbindgen reads.
# ----------------------------------------------------------------------------
[parse]
# Parse ONLY the curl-rs-ffi crate. All C-visible types -- the `#[repr(C)]`
# structs, the opaque CURL/CURLSH aliases, the callback typedefs, and the
# CURLcode / CURLINFO / CURLoption enums -- are DEFINED IN curl-rs-ffi itself
# (src/types.rs, src/error_codes.rs, ...), never re-exported from curl-rs-lib.
# This keeps header generation self-contained and deterministic.
parse_deps = false
# Whitelist of crate names allowed to be parsed -- curl-rs-ffi only. Do NOT add
# curl-rs-lib to the parse set.
include = ["curl-rs-ffi"]

# ----------------------------------------------------------------------------
# [enum] -- CURLcode integer stability (high-risk).
# ----------------------------------------------------------------------------
[enum]
# Keep variant names exactly (CURLE_OK, CURLE_UNSUPPORTED_PROTOCOL, ...).
rename_variants = "None"
# Do not prefix variants with the enum name.
prefix_with_name = false
# Do NOT let cbindgen append its own sentinel variant: curl's terminators
# (CURL_LAST and the `#define CURLE_ALREADY_COMPLETE 99999`) are explicit.
add_sentinel = false
# cbindgen emits the enum, but the EXACT integer values are guaranteed by
# explicit discriminants in src/error_codes.rs (`#[repr(C)]`/`#[repr(i32)]`
# enums declared `CURLE_OK = 0`, ...). If cbindgen output ever diverges from
# the reviewed curl.h CURLcode block, reconciliation keeps the ABI-correct
# public declaration -- an off-by-one breaks the ABI.

# ----------------------------------------------------------------------------
# [struct] -- C structs must match curl's layout exactly.
# ----------------------------------------------------------------------------
[struct]
# Disable all Rust-only derives in the C output. Public structs (curl_slist,
# curl_version_info_data, curl_fileinfo, curl_blob, curl_ws_frame, curl_header,
# curl_easyoption, curl_sockaddr, ...) are `#[repr(C)]` in the crate and must
# render with identical field order and padding to curl.
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

# ----------------------------------------------------------------------------
# [fn] -- functions keep the `extern "C"` calling convention; cbindgen's
# defaults are correct, so this table is intentionally empty.
# ----------------------------------------------------------------------------
# NOTE: the three C-variadic entrypoints -- curl_easy_setopt(CURL*, CURLoption,
# ...), curl_easy_getinfo(CURL*, CURLINFO, ...) and curl_multi_setopt(CURLM*,
# CURLMoption, ...) -- are emitted by cbindgen WITHOUT the `...` ellipsis,
# because the Rust shims are non-variadic on stable Rust. The reconciled easy.h /
# multi.h public headers provide the correct variadic signatures.
[fn]

# ----------------------------------------------------------------------------
# [const] -- emit `#define`-style constants derived from Rust consts.
# ----------------------------------------------------------------------------
[const]
allow_static_const = true

# ----------------------------------------------------------------------------
# [macro_expansion] -- curl does not use the Rust `bitflags` crate in its
# public API, so disable bitflags expansion.
# ----------------------------------------------------------------------------
[macro_expansion]
bitflags = false
