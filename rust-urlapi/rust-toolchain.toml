#
# Toolchain selection for curl-urlapi-rs, the Rust re-implementation of
# curl's URL API. It standardises the channel, the rustup profile and the
# components, so GNUmakefile and scripts/build-rust.sh can invoke a bare
# `cargo build` without either of them naming a toolchain: this file replaces
# the compiler checks a configure script would otherwise carry. It does not
# pin a compiler version, so it does not make builds byte-reproducible; see
# the channel key below for why that is the wanted trade. rustup applies it
# to every command run anywhere under rust-urlapi/ and to nothing outside it,
# so curl's own autotools and CMake builds are unaffected by its presence.
#
# Three different minimum versions are in play, and they are easy to
# confuse. All three are recorded here so nobody has to derive them again:
#
#   1.75  This crate's declared minimum supported Rust version, from the
#         technical specification. Every line of the crate and every
#         dependency of the default feature set must compile on it. It is
#         declared where Cargo can act on it, as rust-version = "1.75" in
#         Cargo.toml, and edition 2021 goes with it.
#
#   1.73  curl's own documented Rust floor: docs/RUSTLS.md:59 tells
#         contributors to install "the 1.73+ or newer toolchain". This crate
#         deliberately sits two point releases above that floor, at 1.75, as
#         its specification requires; the two numbers are close on purpose,
#         which is also why the default dependency set is one crate wide.
#
#   1.65  The minimum declared by libc 0.2.189, the only dependency the
#         default configuration has. The default build therefore clears
#         both of the floors above with room to spare.
#
# The optional idn-pure feature is the one feature-specific exception, and
# the numbers below are precisely why it is not a default. It replaces
# libidn2 with the pure-Rust idna crate, and the adapter plus the
# internationalisation components behind it each declare a far newer minimum:
# in the committed Cargo.lock that is eight packages at 1.86 -- idna_adapter
# and the seven icu_* crates -- six at 1.82 and one at 1.83. The effective
# floor for that configuration is therefore 1.86, above both 1.75 and curl's
# 1.73, so idn-pure stays opt-in. Bit-for-bit parity with the libidn2 call
# sequence in lib/idn.c is claimed for the default backend only; see
# Cargo.toml and docs/KNOWN-DIVERGENCES.md.
#
# The genheader feature is deliberately *not* a second exception, and keeping
# it that way took two decisions that are easy to undo by accident. cbindgen
# is depended on with default-features = false, because its only default
# feature exists for its command-line binary and drags in clap 4.6, which is
# published as edition 2024 and cannot even be parsed by Cargo 1.75. And the
# generator's remaining graph is pinned in Cargo.lock to its newest
# 1.75-compatible releases -- indexmap 2.11.4, toml 0.9.6 and the toml_*
# family, serde_spanned 1.0.1, hashbrown 0.16.1, getrandom 0.3.3 -- which is
# what `cargo update` produces only with
# CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback set. A plain
# `cargo update` re-selects 1.85-only versions of exactly those packages and
# silently breaks the floor. With both in place, every package the host
# builds under --features genheader compiles on 1.75.
#
# Two lockfile entries above 1.75 belong to neither story and are recorded
# here so they are not mistaken for drift: wasi and wit-bindgen, at 1.82,
# reach the lock only as wasm32-wasip2-gated dependencies of getrandom.
# Nothing builds them for the host, and this crate declares no wasm target;
# see the note on the absent `targets` key below.
#
# Note the division of labour between the two files: this one selects which
# toolchain builds the crate, while rust-version in Cargo.toml declares the
# oldest toolchain the sources support. They are independent, and the
# toolchain in use is normally far newer than the declared minimum.

[toolchain]
# The stable channel, never a point release. Naming one point release would
# stop the crate building on every newer stable for no benefit, because the
# sources are held to the 1.75 floor above and gain nothing from a newer
# compiler. Nor is a nightly or beta channel wanted: the crate uses only
# stable language and Cargo features, which is what makes a channel name
# sufficient here.
channel = "stable"

# Install the compiler, cargo and the standard library, and no more. The
# profile governs what rustup materialises when it first installs the
# channel; the components below are then requested explicitly, so they are
# present whichever profile a contributor already had configured.
profile = "minimal"

# clippy             `cargo clippy -- -D warnings` has to pass clean, so the
#                    lint driver belongs to the pinned toolchain rather than
#                    being something a build script hopes to find.
# rustfmt            .editorconfig carries no [*.rs] section, so Rust
#                    sources fall back to rustfmt's own defaults; the
#                    formatter has to be present to apply and to check them.
# llvm-tools-preview the LLVM binary utilities, llvm-profdata and llvm-cov,
#                    that the coverage tooling drives.
components = ["clippy", "rustfmt", "llvm-tools-preview"]

# There is deliberately no `targets` key. The crate is built for the host
# only: the parity demonstration runs on one platform, and the Windows-only
# paths ported from lib/urlapi.c are compiled conditionally but are not
# validated here. Naming a target would ask rustup to fetch a standard
# library that nothing in this directory links against.
