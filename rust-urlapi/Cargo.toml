# Copyright (C) Daniel Stenberg, <daniel@haxx.se>, et al.
#
# SPDX-License-Identifier: curl
#
# Manifest for curl-urlapi-rs: the Rust re-implementation of curl's URL API.
#
# The crate is a binary-compatible, drop-in replacement for the object file
# produced from lib/urlapi.c. It exports the identical C ABI declared in
# include/curl/urlapi.h, so the surrounding C code and curl's own URL API
# test program, tests/libtest/lib1560.c, link against it unchanged.
#
# The crate is build-self-contained on purpose, because curl's build system
# is not modified. The two build references the C module has today,
# lib/Makefile.inc:267 for urlapi.c and lib/Makefile.inc:394 for
# urlapi-int.h, stay exactly as they are: this manifest stands beside them,
# it does not replace them. Nothing outside this directory is created,
# edited, moved or deleted.
#
# The two build configurations. GNUmakefile and scripts/ are to use them
# verbatim once those deliverables land; until then they are invoked by hand:
#
#   Mode A, the drop-in and authoritative configuration
#     cargo build --release --no-default-features --features idn-libidn2
#     Links beside a real libcurl, so the crate must not define a single
#     symbol that libcurl already defines: strerror, cfree and scheme-table
#     are all off.
#
#   Mode B, standalone
#     cargo build --release
#     Links with no libcurl at all, so the crate supplies curl_url_strerror,
#     curl_free and a built-in scheme table itself, alongside the small C
#     shims for the curl_mprintf family in harness/shims.c.

[package]
name = "curl-urlapi-rs"
version = "0.1.0"
# Edition 2021 is mandated, and it must not be raised: under this edition
# the export attribute in src/ffi.rs is the plain #[no_mangle], not the
# #[unsafe(no_mangle)] form that later editions require.
edition = "2021"
# The declared minimum supported Rust version. curl's own documented floor
# is 1.73 (docs/RUSTLS.md:59) and libc's own minimum is 1.65, so the default
# configuration clears both with room to spare.
#
# It holds for every feature combination this crate offers EXCEPT the opt-in
# idn-pure backend, and that is a property of the committed Cargo.lock rather
# than of this line: a single locked package declaring a higher floor, or
# carrying a manifest edition a 1.75 Cargo cannot parse, makes the
# combination that reaches it unbuildable. Two facts about the committed
# lockfile are worth knowing before touching it.
#
# First, idna 1.1.0 resolves idna_adapter 1.2.2, which is published as
# edition 2024 and pulls the icu 2.x line, and eight of those packages
# declare rust-version = "1.86". That is why idn-pure is opt-in and is the
# one documented exception to the floor above -- AAP 0.5.1 records the
# resolution and 0.5.1.2 records the measurement -- and it is why the lock is
# NOT re-pinned to an older IDNA line to make that configuration reach 1.75.
#
# Second, genheader is deliberately not a second exception, and it is not one
# only because build.rs generates from src/lib.rs with cbindgen's
# `Builder::with_src`. `Builder::with_crate` would shell out to
# `cargo metadata`, which resolves and parses the whole graph including
# optional dependencies, so a 1.75 Cargo would abort on idna_adapter's
# edition while compiling none of it. The generate() documentation in
# build.rs states the mechanism in full; source mode emits byte-identical
# bytes and never invokes Cargo.
#
#   default                      libc 0.2.189                     -> 1.65
#   --no-default-features
#     --features idn-libidn2     libc 0.2.189                     -> 1.65
#   --features genheader         + cbindgen 0.29.4 and its 32      -> 1.74
#                                  build-closure packages, whose
#                                  highest declared floor is
#                                  cbindgen's own
#   --features idn-pure          + idna 1.1.0, idna_adapter 1.2.2  -> 1.86
#                                  and the icu 2.2.0 line
#
# So the 1.75 declared above holds for the default, drop-in and genheader
# configurations, and does NOT hold for idn-pure: idna_adapter 1.2.2 and the
# five icu_* 2.2.0 packages each declare rust-version = "1.86". That is stated
# again at the idn-pure feature below and in docs/KNOWN-DIVERGENCES.md, and it
# is one of the two reasons that backend is not the default. Nothing pins an
# icu 1.5 series; the lock resolves icu 2.2.0.
#
# The verification matrix. The first four lines are expected to pass on the
# declared floor. idn-pure is listed last and on a different channel, because
# its graph needs 1.86 and that is the documented exception rather than a
# regression:
#
#   cargo +1.75.0 check --locked
#   cargo +1.75.0 check --locked --no-default-features
#   cargo +1.75.0 check --locked --no-default-features --features idn-libidn2
#   cargo +1.75.0 check --locked --features genheader
#   cargo         check --locked --no-default-features --features idn-pure
#
# All four 1.75 lines must pass; genheader is one of them only because
# build.rs generates in source mode, and the note above says why. Regenerate
# the lockfile only with CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback
# set, so the resolver keeps the generator's own graph on releases the floor
# above can compile; a plain `cargo update` re-selects 1.85-only versions of
# exactly those packages and silently breaks it.
#
# build.rs prints a cargo:warning on every build that selects that backend,
# naming the four ways it diverges from libidn2, because it is outside the
# parity claim; see docs/KNOWN-DIVERGENCES.md for the detail.
rust-version = "1.75"
license = "curl"
description = "Binary-compatible Rust port of curl's URL API (lib/urlapi.c)"
homepage = "https://curl.se/"
repository = "https://github.com/curl/curl"
# The packaging contract for this key, stated because the two halves of it
# behave very differently. Nothing in the ordinary workflow reads the file:
# `cargo build`, `cargo check`, `cargo test` and `cargo clippy` ignore it, and
# `publish = false` below rules out the registry entirely. `cargo package`
# does read it and fails if the path does not resolve, so this key is a
# requirement that README.md exist beside this manifest -- as is the cargo-c
# install asset named further down for the mirror header.
readme = "README.md"
# Declared explicitly rather than left to auto-detection, so the
# relationship with the build script is legible. build.rs emits the link
# directives, maps the selected features onto cfg flags, and rejects a
# contradictory pair of IDN backends.
build = "build.rs"
# This crate is a drop-in artifact for one specific object file, not a
# registry package. No ABI-versioning work is in scope either: there is no
# SONAME design, and docs/libcurl/symbols-in-versions gains no entry,
# because the port introduces no new public symbol. It re-implements
# existing ones.
publish = false

# Deliberately empty, and deliberately present. It makes this directory its
# own workspace root, which buys two things. Cargo stops walking up the tree
# in search of a parent workspace, which it would otherwise do and fail at
# as soon as anything above this directory grew a manifest; and Cargo.lock
# is written here, inside the crate, rather than somewhere outside it. No
# member, path or inheritance clause points outside this directory, because
# the crate has to build with no help from curl's build system.
[workspace]

[lib]
# Underscores here. This is the library name and it is distinct from the
# hyphenated package name above, and it is what any link line has to name:
# libcurl_urlapi_rs.a and libcurl_urlapi_rs.so.
name = "curl_urlapi_rs"
# All three types earn their place.
#
# staticlib is what the deliverable is MADE FROM, and the distinction is
# load-bearing rather than pedantic. The archive contains this crate's code
# together with all upstream Rust dependencies, which means the whole of the
# Rust standard library, the allocator and the unwinder, and every one of
# those carries global symbols. Measured on the release build: 2413 distinct
# defined globals, where lib/urlapi.c's object file defines 8. That is not a
# defect -- it is what a staticlib is -- but it is not "exporting the complete
# symbol set that lib/urlapi.o exports and no more" either, which is what the
# Agent Action Plan requires at G1 and checks at A2.
#
# The drop-in artifact is therefore produced FROM this archive by a
# localization pass, the technique the plan holds in reserve at 0.3.2:
# `ld -r --whole-archive` combines every member into one relocatable object,
# `objcopy --keep-global-symbol` localizes every global except the ABI set,
# and `ar rcs` re-archives it. The result defines exactly 8 globals in the
# drop-in configuration and exactly 10 in the standalone one, where
# curl_url_strerror and curl_free are real exports. build.rs implements it and
# verifies the complete set with `nm -g --defined-only`, failing on anything
# missing and on anything extra; see `localize_dropin_archive` there for the
# commands and for why it is a second invocation -- Cargo has no post-build
# hook, so a build script cannot post-process an archive that does not exist
# until after it has run:
#
#   cargo build --release --no-default-features --features idn-libidn2
#   CURL_URLAPI_DROPIN_ARCHIVE=target/release/libcurl_urlapi_rs.a \
#     cargo build --release --no-default-features --features idn-libidn2
#
# Two consequences the link lines have to respect either way: exactly one Rust
# staticlib may take part in a link, since several are likely to conflict, and
# the archive's own dynamic dependencies have to be named by hand on the link
# line because nothing else knows they are needed. Verified end to end --
# libcurl's own test1560 binary, linked against a libcurl archive with
# urlapi.c.o deleted plus the localized drop-in archive, resolves all its
# undefined references and prints `success`.
#
# cdylib proves the crate is independently linkable. It exposes symbols the
# way an executable does: a plain `pub fn` is not exported, only an
# annotated `#[no_mangle] pub extern "C" fn` is. Since src/ffi.rs is the
# only module carrying those attributes, nothing leaks by accident and the
# export set stays auditable against the C object file.
#
# rlib is what makes `cargo test` possible at all: the integration tests
# under tests/ link the crate as an ordinary Rust library.
crate-type = ["staticlib", "cdylib", "rlib"]

# Cargo features stand in for the C preprocessor switches, which is the
# mapping the technical specification prescribes for C's #ifdef
# CURL_DISABLE_* and USE_* macros expressed in the target language.
#
# The first three are not conveniences. Each exists because libcurl already
# supplies what it provides -- curl_url_strerror in lib/strerror.c, curl_free
# in lib/escape.c, Curl_get_scheme in lib/url.c -- and all three of those
# files are out of scope and cannot be touched. All three must therefore be
# OFF in Mode A, the drop-in configuration, and ON in Mode B, the standalone
# one.
#
# They do not fail the same way when set wrongly in Mode A, and the
# difference decides how much attention each needs.
#
#   strerror and cfree fail LOUDLY. The crate really does define
#   curl_url_strerror() and curl_free() under those features, so leaving
#   either on in Mode A gives the linker two definitions of one symbol and
#   the link stops. Unpleasant, self-announcing, fixed in one edit.
#
#   scheme-table fails SILENTLY, and this is the one to watch. The crate
#   never defines Curl_get_scheme outside its own tests, so leaving
#   scheme-table on in Mode A produces no duplicate symbol and no link error
#   at all. What it produces is a clean link against the crate's own built-in
#   33-row table instead of the linked libcurl's real one -- and that table
#   answers "is this protocol implemented?" with yes for every row, because
#   in a standalone build there is no protocol implementation for a #ifdef to
#   have removed. src/scheme.rs:405-425 documents the substitution and its
#   consequence: curl_url_set(u, CURLUPART_SCHEME, "rtmp", 0) succeeds where
#   a libcurl built without librtmp answers CURLUE_UNSUPPORTED_SCHEME. The
#   drop-in backend reads the real h->run pointer and reaches that path
#   exactly when the linked libcurl does.
#
# build.rs cannot detect the link mode -- nothing in a Cargo build knows
# which archive a later C link line will name -- so this comment, that one,
# and the entry in docs/KNOWN-DIVERGENCES.md are the only available controls.
# Mode A is --no-default-features --features idn-libidn2, and a Mode A
# integrator should read src/scheme.rs:405-425 before assuming a clean link
# means a correct one.
[features]
# Mode B, the standalone configuration: the crate supplies everything the
# demo program and the lib1560 harness need when no libcurl takes part in
# the link.
default = ["strerror", "cfree", "scheme-table", "idn-libidn2"]

# Export curl_url_strerror() and its 33 message strings. Must be off in
# Mode A: that function is not implemented in lib/urlapi.c at all, it lives
# in lib/strerror.c:420-531, so exporting it here as well would define the
# symbol twice. Dropping it unconditionally is not an option either, because
# the standalone demo is required to call it. Hence a feature rather than a
# fixed choice.
strerror = []

# Export curl_free(). Must be off in Mode A, where lib/escape.c:189 already
# defines it. In Mode B nothing else supplies it, yet the documented
# contract that a buffer from curl_url_get() is released with curl_free()
# still has to hold, so the crate provides it.
cfree = []

# Compile a built-in scheme table: the default ports, the URL-options
# capability bit and the protocol-enabled marker that the parser consults.
# When off, Curl_get_scheme() is imported from libcurl instead
# (lib/url.c:1469-1471), so the real and complete table is used and this
# crate contributes none of its own.
#
# Must be off in Mode A, and leaving it on there is the silent failure
# described above rather than a link error. The built-in table's protocol
# markers are compile-time constants describing ONE build -- the reference
# build the parity run compares against -- so with the feature wrongly left on
# in Mode A the parser consults that build's capability set instead of the
# linked libcurl's, and every disagreement between the two is accepted
# silently. Recorded in docs/KNOWN-DIVERGENCES.md under
# "Integration limitation: the standalone table models one build".
scheme-table = []

# The default IDN backend: bind libidn2 directly and replicate the call
# sequence of lib/idn.c function for function, including the version check,
# the exact flag set, the transitional retry after a failure and the
# rejection of a zero-length result. That is what makes bit-for-bit parity
# attainable, libidn2's locale sensitivity included, and several lib1560
# assertions depend on it. Parity is claimed for this backend only.
idn-libidn2 = []

# The alternative IDN backend: the pure-Rust idna crate, so a build needs no
# C IDN library. Opt-in only, and not bit-for-bit. It has no transitional
# retry; it uses different Unicode tables; and it is locale-independent,
# where the libidn2 path goes through idn2_lookup_ul and so interprets its
# input in the encoding of the process locale, which may convert differently
# or fail outside a UTF-8 locale. In the C locale it fails, which is the
# behaviour the parity runs are to measure.
#
# Its cost, counted out of the committed Cargo.lock rather than estimated: it
# takes the dependency closure from one package to thirty-one, adding idna
# 1.1.0, idna_adapter 1.2.2, the five icu_* 2.2.0 packages with their two data
# crates, and the zerovec/yoke/zerofrom supporting line. idna_adapter 1.2.2 and
# every icu_* 2.2.0 package declares rust-version = "1.86", so selecting this
# backend raises the effective minimum toolchain to 1.86 -- above this crate's
# declared 1.75 and above curl's documented 1.73. That, and the loss of the
# bit-for-bit claim, are the two reasons it is not the default. The divergences
# are recorded in docs/KNOWN-DIVERGENCES.md.
idn-pure = ["dep:idna"]

# Check include/curl_urlapi_rs.h against the ABI the crate actually declares,
# so the committed mirror header cannot drift away from the code it describes
# without somebody being told.
#
# What is compared is an ABI projection, not text: build.rs generates a mirror
# with cbindgen's library API into OUT_DIR, reduces both that file and the
# committed one to their constant name/value pairs, their function signatures
# with parameter names dropped, and their typedef names, and reports any
# difference between the two sets. The projection is blind to comments, layout,
# declaration order, parameter names and the enum-versus-macro spelling, which
# is what makes it an ABI check rather than a diff: the two files are never
# byte-equal, and cbindgen.toml records the four shape differences that account
# for it.
#
# Off by default, because the header is committed and an ordinary build must not
# depend on a code generator. The committed header is never rewritten; build.rs
# explains why at length.
genheader = ["dep:cbindgen"]

# The six features above are the complete set, and the count is part of the
# frozen manifest design rather than an accident of how many were needed. Do
# not add a seventh.
#
# One consequence is worth stating here rather than leaving to be discovered,
# because it looks like a defect and is not. cargo-c inserts a feature named
# `capi` into the requested set unconditionally --
# cargo-c 0.10.24 src/build.rs:811 -- and it treats a package as C-API-relevant
# only when that feature is declared, src/build.rs:1183-1186. It sets no
# environment variable, so a build script has no other way to recognise a
# packaging run. `cargo cbuild` and `cargo cinstall` therefore cannot work
# against this manifest as it stands: Cargo rejects `--features capi` for a
# feature the package does not declare.
#
# That is reported, not worked around, and the reasoning is the same one the
# whole crate is built on. The six-feature design is fixed, while the cargo-c
# path is a stretch goal and an optional developer convenience -- it is a tool
# invoked from scripts/, never a dependency, and nothing in this repository's
# build system points at it. Where a frozen requirement and an optional
# convenience collide, the requirement governs. A developer who wants the
# cargo-c path can add `capi = []` locally; the [package.metadata.capi]
# sections below are already complete and are metadata rather than features,
# so nothing else has to change. Committing that seventh feature does not.

# The two IDN backends are mutually exclusive in intent, mirroring the
# #error at lib/curl_setup.h:726-728. Cargo features are additive by
# design, so that cannot be expressed in TOML: build.rs fails the build when
# both are requested, and src/idn.rs rejects the combination at compile time
# as well.

# Provenance: every dependency comes from the public crates.io registry at an
# exact pinned version, with the resolved set recorded in the committed
# Cargo.lock. There is no git, path or vendored source anywhere in this file,
# and no [patch] or [replace] section. The specification allows a vendoring
# exception only with a documented reason, and this crate needs none.
[dependencies]
# The C allocator entry points, the C scalar and pointer type aliases, and
# the libidn2 externs used by the default IDN backend. Required, and central
# to the memory-ownership design: every buffer this crate hands to C is
# allocated with the C allocator, so the caller's curl_free() releases it
# correctly in the two supported configurations, where curlx_free resolves to
# plain free() or to the Curl_cfree hook still holding its default. It is not
# correct under a memory-debug build, whose tracking free validates pointers
# against its own table, nor when an application has substituted the
# allocator through curl_global_init_mem(); both are excluded, and
# docs/MEMORY-OWNERSHIP.md records the whole resolution chain. Allocating
# with the C allocator also rules out the idiomatic CString::into_raw route,
# whose pointer has to come back to Rust to be released. libc's own minimum
# toolchain is 1.65.
#
# Pinned to the 0.2 line on purpose. The registry also lists 1.0.0-alpha.4,
# but that is a pre-release: Cargo will not select it for a "0.2"
# requirement, nor even for a bare "1" one, without an explicit pre-release
# opt-in. The version that actually resolves here is 0.2.189. Reading the
# registry as "take the newest number shown" produces a manifest that does
# not build, so do not "upgrade" this to the 1.0.0-alpha line.
libc = "0.2.189"

# Optional, and reachable only through the idn-pure feature. That feature
# refers to it as dep:idna so that enabling the dependency does not also
# create an implicit feature named after it, which keeps the feature surface
# exactly the set declared above.
idna = { version = "1.1.0", optional = true }

[build-dependencies]
# Optional, and reachable only through the genheader feature, which likewise
# refers to it as dep:cbindgen.
#
# default-features = false on purpose. cbindgen's default feature set builds
# its command-line front end, which pulls in clap and the whole terminal
# styling chain behind it -- anstream, anstyle and its three siblings,
# colorchoice, strsim, is_terminal_polyfill, once_cell_polyfill, utf8parse.
# build.rs uses the library API alone, cbindgen::Config::from_file and
# cbindgen::Builder, so none of that is reachable code here: it is twelve
# packages of supply-chain surface and nothing else.
#
# Dropping them is also what keeps the genheader closure inside the declared
# MSRV, so the two reasons are one reason. cbindgen itself declares
# rust-version = "1.74" and was never the obstacle; the front-end chain was.
# With the defaults off, the whole closure is 33 packages and 1.74 is the
# highest floor any of them declares -- verified against the committed
# Cargo.lock, where indexmap is 2.11.4 (1.63), hashbrown 0.16.1 (1.65), toml
# 0.9.6 (1.66) and syn 2.0.119 (1.71). The matrix beside rust-version above is
# what keeps a regression here visible.
cbindgen = { version = "0.29.4", optional = true, default-features = false }

# Evaluated and rejected, recorded here so they are not added later.
#
# punycode implements the raw encoding algorithm only, with no case mapping and
# no normalisation, so it cannot reproduce the standard curl actually applies.
#
# idna_adapter is pulled in transitively by idna under idn-pure and must never
# become a direct dependency.
#
# Nothing to do with networking, async runtimes or parser combinators belongs
# here either, because this module performs no input or output at all.
#
# cargo-c belongs to neither table, and unlike cbindgen it really is a program:
# scripts/build-rust.sh is to invoke it as `cargo cbuild`. The constraint that
# tool imposes is recorded beside [features] above.
#
# cbindgen is the one that reads as a contradiction if this note is skimmed, so
# it is stated plainly: it IS a dependency, declared above under
# [build-dependencies], and build.rs uses its library API rather than shelling
# out to its binary. `default-features = false` is what makes that affordable --
# it drops the clap and terminal-styling chain that the command-line front end
# needs, leaving a 33-package closure whose highest declared rust-version is
# cbindgen's own 1.74, below this crate's declared 1.75. Verified against the
# committed Cargo.lock. An earlier revision of this file described cbindgen as
# an external tool kept out of the graph; that was never what the code did.
[profile.release]
# Link-time optimisation across the crate graph, and a single code-generation
# unit. The archive is consumed by a C link line, so there is no reason to
# leave cross-crate inlining unused.
#
# One interaction is worth knowing about before concluding the setting is
# broken: an rlib cannot be produced with full link-time optimisation, so
# where Cargo builds all three crate types as one unit, as a plain
# `cargo build --release` does, it quietly leaves -Clto off. The cargo-c
# path, which is the one a C consumer actually uses, builds the archive and
# the shared object without the rlib and does apply it.
lto = true
codegen-units = 1
# Belt and braces rather than the primary defence. Every exported function is
# extern "C", and a panic that would escape an extern "C" function already
# aborts instead of causing undefined behaviour, so this setting mainly makes
# the intent explicit. The real defence is in src/lib.rs, which denies the
# panicking constructs, that is unwrap, expect, direct indexing, an explicit
# panic! and unchecked arithmetic, so that panics are designed out rather
# than handled. Quietly substituting an error code for a panic would hide
# exactly the class of bug the parity diff exists to expose.
panic = "abort"
# Keep the symbol table. scripts/check-abi.sh compares
# `nm -g --defined-only` on this archive against the symbol set of the C
# object file it replaces, and stripping would make that comparison vacuous.
strip = false

# The dev and test profiles are left at their defaults, panic = "unwind"
# included. That is a decision, not an oversight: the test harness needs
# unwinding to report a failing assertion, so panic = "abort" belongs on the
# release profile alone. The C-ABI posture is unaffected, because aborting on
# a panic that reaches an extern "C" boundary does not depend on the profile.

# cargo-c metadata, for the optional `cargo cbuild` and `cargo cinstall`
# path. It produces the archive, the shared object, the pkg-config files and
# the header a C consumer expects, which is the same mechanism curl's own
# documentation already points at for consuming Rust as a C library
# (docs/RUSTLS.md:56, 61-62, 68).
#
# This is packaging support and nothing more. All of it lives inside this
# directory: none of it wires the crate into curl's build system, and none of
# it needs a change to lib/Makefile.inc, CMakeLists.txt or any other build
# file.
#
# Metadata, not features. These sections are inert for an ordinary build and
# are complete, so the cargo-c path needs nothing further from this file --
# except the one thing the [features] note above explains is deliberately not
# here, the `capi` feature cargo-c insists on. Read that note before
# concluding these sections are unused.
[package.metadata.capi]
min_version = "0.10.0"

[package.metadata.capi.header]
# The mirror header is committed under include/, so cargo-c must not run its
# own generator and emit a second, competing header. Regeneration is the
# genheader feature's job instead.
generation = false
# Install as include/curl_urlapi_rs.h rather than into a per-crate
# subdirectory. That keeps the pkg-config Cflags at -I${includedir} and lets
# the demo include "curl_urlapi_rs.h" unqualified.
subdirectory = false

[package.metadata.capi.install.include]
# With generation switched off there is nothing for cargo-c to emit, so the
# committed header is installed explicitly. Without this the cargo-c path
# would ship a library with no header at all.
#
# The file this names is committed under include/ and is hand-authored, which
# is what makes `generation = false` above the right setting: cargo-c ships
# the committed bytes rather than emitting a competing header of its own.
# build.rs writes its regenerated copy into OUT_DIR and never into this path,
# which is what keeps the install asset and the hand-authored source the same
# file.
asset = [{ from = "include/curl_urlapi_rs.h" }]

[package.metadata.capi.library]
name = "curl_urlapi_rs"
# No ABI-versioning work is in scope, so no versioned SONAME chain is
# produced and the shared object stays plain libcurl_urlapi_rs.so.
versioning = false

[package.metadata.capi.pkg_config]
name = "curl_urlapi_rs"
filename = "curl_urlapi_rs"
description = "Binary-compatible Rust port of curl's URL API"
