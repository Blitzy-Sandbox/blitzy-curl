# Copyright (C) Daniel Stenberg, <daniel@haxx.se>, et al.
#
# SPDX-License-Identifier: curl
#
# Header-generation configuration for curl-urlapi-rs, the Rust
# re-implementation of curl's URL API.
#
#
# It generates the same public CONTRACT that include/curl_urlapi_rs.h
# carries -- the 33-value CURLUcode set (urlapi.h:34-68), the 11-value
# CURLUPart set (70-82), the 16 CURLU_* flag bits (84-105), the opaque CURLU
# handle (107) and the six public functions (113, 120, 126, 133-134,
# 141-142, 149), inside an include guard and an extern "C" wrapper -- and
# nothing else.
#
# It does NOT generate the same BYTES, and this file used to claim otherwise.
# It cannot: the section below lists the differences cbindgen imposes that no
# key here can configure away, and one of them is structural rather than
# cosmetic, because src/abi.rs expresses the 60 values as explicit integer
# constants rather than as Rust enumerations. That is the Agent Action Plan's
# transformation rule T2 -- a Rust enumeration's discriminants could be
# reordered by a later edit, and the C numbering is positional -- so cbindgen
# has no enumeration to emit and produces `typedef int CURLUcode;` with 33
# `#define`s where the committed header writes `typedef enum { .. }
# CURLUcode;`. Measured on a clean checkout: 357 unified-diff lines.
#
# So the comparison is over a normalized SEMANTIC SURFACE, not over bytes.
# build.rs reduces both files to a sorted list of 69 canonical entries -- 60
# `const NAME = VALUE`, 2 `scalar NAME`, 1 `opaque NAME` and 6
# `fn RET NAME ( .. )` -- and any difference between the two lists FAILS THE
# BUILD. `mod mirror_header::surface` in build.rs lists all seven
# normalizations with the proven reason each one is cosmetic, and nothing
# else is normalized: no name, no numeric value, no return type, no parameter
# type, no parameter count and no const qualifier. Verified by injecting
# drift three ways -- a changed constant value, an extra public constant and a
# changed parameter type -- each of which fails the build with the offending
# entry named.
#
# build.rs reads this file, and only when the optional genheader feature is
# enabled. That feature is off by default because the header is committed
# and an ordinary build must not depend on a code generator. The same output
# is reachable by hand with the version Cargo.toml pins, run from this
# directory:
#
#   cbindgen --config cbindgen.toml --lang c \
#     --output /tmp/curl_urlapi_rs.generated.h
#
# The check matters more than the artifact. include/curl_urlapi_rs.h is
# hand-authored and stays authoritative; regenerating it and comparing the
# surfaces is what catches the Rust surface in src/ffi.rs and the C ABI
# contract in include/curl/urlapi.h drifting apart. Reconcile any difference
# by changing this configuration or the Rust items -- never by changing
# include/curl/urlapi.h, which is read-only and is never modified, moved or
# shadowed, and never by installing generated bytes over the committed
# header, which the next section explains cannot meet the contract.
#
# Only the standalone link mode uses the mirror. No libcurl takes part in
# that link, so the mirror is the only header in play. The drop-in mode uses
# the real include/curl/urlapi.h, and this mirror stays out of its way: a
# different file name, a different directory and a different include guard,
# so the two can never collide and neither can shadow the other.
#
#
# TWO LICENCE BLOCKS, BOTH NEEDED
#
# The "#" block at the top of this file licenses this configuration file, so
# that `reuse lint` passes for it. TOML takes comments, so it is annotated
# directly rather than through an entry in REUSE.toml, which is out of
# scope. The `header` key below carries the /* */ box that licenses the
# GENERATED header, which cbindgen would otherwise emit with no annotation
# at all. Drop either block and one of the two files fails the licence gate.
#
#
# KEY NAMES ARE NOT NEGOTIABLE
#
# Cargo.toml pins cbindgen 0.29.4, and every configuration struct in that
# version carries serde(deny_unknown_fields). An unknown or misspelled key
# is therefore a hard parse error rather than a warning, and a key a later
# cbindgen renames would break the genheader build outright. Every key below
# corresponds to a field of that version's own config.rs, and every string
# value to the FromStr implementation that parses it.
#
#
# WHAT THE GENERATED HEADER IS, AND IS NOT
#
# Six differences are imposed by cbindgen itself and no key here can
# configure them away. They are why the committed header is hand-authored,
# and each of them is why one of build.rs's seven surface normalizations
# exists; docs/KNOWN-DIVERGENCES.md records them.
#
#   1. The 33 result codes and the 11 part identifiers arrive as
#      `typedef int CURLUcode;` plus one `#define` per value, where
#      urlapi.h:34-68 and 70-82 write two `typedef enum` blocks. Not a
#      cbindgen limitation as such -- it follows from src/abi.rs holding
#      explicit integer constants rather than Rust enumerations, which is
#      transformation rule T2 -- but it is the largest single difference and
#      the reason byte equality is unreachable. Compared numerically instead,
#      which is the only comparison the positional C numbering supports.
#   2. `#endif // __cplusplus` and `}  // extern "C"` around the extern "C"
#      block, hard-coded with // comments. Under C89 those are not comments,
#      so the compiler reports "extra tokens at end of #endif directive" and
#      checksrc reports CPPCOMMENTS. The wrapper is still wanted, so
#      cpp_compat stays on below.
#   3. The opaque tag is `struct CURLU` -- after the [export.rename] entry
#      below turns the Rust name CurlUrl into CURLU; without it the tag and
#      the typedef name would both be CurlUrl -- where urlapi.h:107 writes
#      `typedef struct Curl_URL CURLU;`. cbindgen derives the tag from the
#      item name and no key can set it separately. ABI irrelevant: the type is
#      incomplete either way and is only ever used through a pointer, which is
#      exactly what makes the port tractable.
#   4. The licence box precedes the include guard, where urlapi.h opens the
#      guard at 1-2 above the box at 3-25.
#   5. Doc comments arrive as `/** .. */` blocks carrying the Rust
#      documentation, where urlapi.h carries its own `/* .. */` prose and its
#      per-value `/* n */` ordinal comments. No comment is part of the ABI.
#   6. curl_url_dup's parameter is spelled `in` at urlapi.h:126, which is a
#      Rust keyword, and rename_args cannot turn a name back into a reserved
#      word. src/ffi.rs spells it `input`, so the generated declaration reads
#      `curl_url_dup(const CURLU *input)`. curl_url_strerror's parameter is
#      the mirror-image case: urlapi.h:149 leaves it unnamed, a cosmetic
#      detail the committed header reproduces and a Rust signature cannot, so
#      the generated declaration names it `code`. Neither is part of the ABI
#      and both are dropped by the surface comparison, which compares
#      parameter TYPES.
#
# Those six aside, the generated header carries no over-length line, no
# tab, no trailing whitespace, no non-ASCII byte and no consecutive blank
# line, so it satisfies scripts/spacecheck.pl unaided.
#
# The same four differences, the same two disproved claims and the same
# measurements are recorded in docs/KNOWN-DIVERGENCES.md, under "Residual
# divergence: the generated mirror header". The two records are one control:
# whichever file a reader arrives at, the other has to agree with it.

# Bare keys come first, before the very first [table] header, because in
# TOML a key written after one belongs to that table. Everything from here
# to [export] is therefore top-level configuration.

# C, not C++ and not Cython. urlapi.h is a C header, consumed by C and,
# through the extern "C" wrapper, by C++.
language = "C"

# "type" emits `typedef enum { ... } CURLUcode;`, which is urlapi.h:34-68 and
# 70-82 exactly. The choice reaches further than the two enumerations,
# though, and both alternatives were generated to be sure of it:
#
#   - "tag" emits `enum CURLUcode { ... };` and then spells every use with
#     the keyword, so the declarations come out as
#     `enum CURLUcode curl_url_get(const struct CurlUrl *handle, ...)`.
#   - "both" emits `typedef enum CURLUcode { ... } CURLUcode;`, adding a tag
#     name urlapi.h does not have, and still spells the uses with the
#     keyword exactly as "tag" does.
#
# So "type" is the only one of the three that produces
# `CURLUcode curl_url_get(const CurlUrl *handle, ...)`, which is the shape
# urlapi.h:133 writes with its own tag name. Under either alternative every
# existing caller would have to be rewritten, which for a drop-in replacement
# is not a style preference.
#
# The setting is kept even though src/abi.rs declares CURLUcode and CURLUPart
# as `c_int` aliases rather than as Rust enums, so this crate emits no
# enumeration for it to govern -- difference 1 in the list at the top of this
# file. It is kept because it also decides how a use of any enum-like type is
# spelled, and because a future edit that introduced one must not silently get
# the "tag" spelling.
style = "type"

# Follows the repository convention CURLINC_<NAME>_H, as urlapi.h:1-2 opens
# CURLINC_URLAPI_H and 155 closes it. A deliberately distinct name: were
# both headers ever reachable from one translation unit, a shared guard
# would silently suppress whichever came second.
include_guard = "CURLINC_URLAPI_RS_H"

# #pragma once is not a standard directive and urlapi.h does not use it. The
# include guard above is the whole mechanism.
pragma_once = false

# Emit the #ifdef __cplusplus / extern "C" { ... } wrapper that urlapi.h
# carries at 29-31 and 151-153, so a C++ translation unit including the
# mirror links against the crate's C symbols rather than looking for mangled
# ones. Divergence 2 above is the price, and it is worth paying.
cpp_compat = true

# The mirror is the only header in play in Mode B, so it has to stand alone.
# Two reasons this is switched on rather than left to the default:
#
#   - urlapi.h:27 includes "curl.h" to pick up CURL_EXTERN. That machinery
#     is not wanted here. There is no libcurl in a standalone link, and the
#     mirror declares the same functions without any visibility decoration.
#   - cbindgen's default include block names stdbool.h, which is C99. The
#     output has to be C89, so the block cannot be allowed through.
#
# This is safe only because the public surface uses nothing beyond char,
# unsigned int, void and the crate's own three types. Should a future
# signature need a fixed-width or size type, no_includes has to give way to
# a specific sys_includes entry rather than being worked around.
no_includes = true

# Both lists are empty and both are stated rather than omitted, so that the
# absence of an include reads as a decision. no_includes above overrides
# them in any case.
includes = []
sys_includes = []

# Do NOT carry the Rust doc comments through. This was measured before it was
# decided: with documentation on, cbindgen emits every one of src/ffi.rs's and
# src/abi.rs's doc comments into the output, which took the generated file to
# 614 lines against the committed header's 219 and buried the declarations in
# Rust-facing prose about `CBuf`, module layout and lint policy. None of that
# belongs in front of a C caller.
#
# The commentary a C caller does need is in the committed header, which is
# hand-authored precisely so that it can carry urlapi.h's own wording -- in
# particular the two memory-ownership sentences the header states and the
# manual pages repeat: that curl_url_cleanup() does not free strings
# previously returned by the URL API (116-118), and that the pointer
# curl_url_get() hands back MUST be freed with curl_free() afterwards
# (130-131). Those two are the highest-risk part of the whole port, so they
# are in the committed file and in docs/MEMORY-OWNERSHIP.md, not left to a
# generator that is off by default.
#
# Turning them off here also makes the generated file what it is for: an ABI
# projection to compare against, small enough to read in one screen.
documentation = false

# "doxy" writes /** then " * text" then " */". That is one character from
# urlapi.h's own /* then " * text" then " */", and it is the closest of the
# four available styles. The two remaining choices are ruled out rather than
# merely not preferred: "c99" writes // and "cxx" writes ///, neither of
# which is a comment in C89. "auto" happens to resolve to "doxy" for C
# today, but naming the style outright means a change to that mapping cannot
# quietly turn the output into something a C89 compiler rejects.
documentation_style = "doxy"

# "full", not "short". "short" keeps only the first line of each comment,
# which would truncate every multi-line note in urlapi.h -- including both
# ownership notes, whose operative sentence is not the first one.
documentation_length = "full"

# curl style: the open brace stays on the line that introduces the block,
# as in `typedef enum {` at urlapi.h:34.
braces = "SameLine"

# 79 columns, which is what .editorconfig sets for *.{c,h} and what
# scripts/checksrc.pl enforces as max_column. The generated header is a
# tracked C header, so it is subject to both. Together with the [fn] args
# setting below this is what breaks curl_url_get() and curl_url_set() across
# lines instead of emitting a 90-column declaration.
line_length = 79

# Two spaces, matching .editorconfig indent_size for *.{c,h} and the
# enumerator indentation in urlapi.h:35-67. Nothing emits a tab: the value
# is a width in spaces, and scripts/spacecheck.pl rejects tabs outright.
tab_width = 2

# LF, explicitly, and never the platform default. scripts/spacecheck.pl
# requires LF line endings for this path, so generating on a CRLF host must
# not produce a header that fails the gate.
line_endings = "LF"

# Keep source order for every category. Sorting is refused, not overlooked,
# and for two separate reasons:
#
#   - Alphabetical order would scramble the 16 CURLU_* flags out of bit
#     order, so CURLU_ALLOW_SPACE (1 << 11) would print above
#     CURLU_DEFAULT_PORT (1 << 0). urlapi.h:84-105 lists them by bit, and
#     that ordering is the only thing that makes the sequence readable.
#   - src/ffi.rs declares the six functions in urlapi.h's own order, which
#     is also alphabetical, so sorting buys nothing there. What it would
#     cost is the drift check: a future reordering would be silently
#     normalised away instead of showing up in the diff.
#
# [fn] and [const] below restate this so that neither can inherit a
# different default later.
sort_by = "None"

# Map Rust usize to size_t rather than uintptr_t. The six public functions
# use neither, so this changes nothing in the emitted header; it is set
# because it is the correct correspondence for this port, and the three
# internal entry points that do take size_t (lib/urlapi-int.h:28-33) would
# otherwise be described wrongly if they were ever exposed. Note the
# coupling with no_includes above: size_t needs stddef.h, so a signature
# that starts using it forces that decision to be revisited.
usize_is_size_t = true

# No version comment from either source. Both are off deliberately, and for
# the same reason as autogen_warning below: the crate version and the
# cbindgen version both move, and either one printed into the output would
# make the generated file differ from the committed one on every bump. The
# diff has to mean something.
package_version = false
include_version = false

# The verbatim 23-line curl licence box, copied byte for byte from
# docs/examples/urlapi.c:1-23, which is itself identical to
# include/curl/urlapi.h:3-25. Its last annotation line carries the SPDX
# identifier for the curl licence, and that is what satisfies `reuse lint`
# for the generated header. Note that the tag is deliberately not spelled out
# anywhere in this comment block: `reuse` scans the whole file for it and
# reads the remainder of the line as a licence expression, so a mention in
# running prose is reported as an invalid expression.
#
# Three mechanical details, the first two established by running the
# generator rather than by reading about it:
#
#   - This is a TOML literal string, ''' rather than """. A basic string
#     would try to interpret the backslashes in the box art -- \___ and
#     \_\_____ -- as escape sequences, and \_ is not a valid one, so the
#     whole file would fail to parse.
#   - The closing ''' sits on the last line of the box, not on a line of its
#     own, which is why that one line runs past 79 columns. A trailing
#     newline inside this value makes cbindgen emit two blank lines before
#     the include guard, and scripts/spacecheck.pl rejects consecutive blank
#     lines in the tracked header. The long line is the lesser cost, and
#     .editorconfig sets no line length for TOML.
#   - Every byte below is ASCII, which scripts/spacecheck.pl requires both of
#     this file and of the generated header. The box art is drawn from
#     _ | / \ ( ) < > and spaces alone, so it survives that rule despite
#     looking like exactly the sort of thing that would not.
header = '''
/***************************************************************************
 *                                  _   _ ____  _
 *  Project                     ___| | | |  _ \| |
 *                             / __| | | | |_) | |
 *                            | (__| |_| |  _ <| |___
 *                             \___|\___/|_| \_\_____|
 *
 * Copyright (C) Daniel Stenberg, <daniel@haxx.se>, et al.
 *
 * This software is licensed as described in the file COPYING, which
 * you should have received as part of this distribution. The terms
 * are also available at https://curl.se/docs/copyright.html.
 *
 * You may opt to use, copy, modify, merge, publish, distribute and/or sell
 * copies of the Software, and permit persons to whom the Software is
 * furnished to do so, under the terms of the COPYING file.
 *
 * This software is distributed on an "AS IS" basis, WITHOUT WARRANTY OF ANY
 * KIND, either express or implied.
 *
 * SPDX-License-Identifier: curl
 *
 ***************************************************************************/'''

# Emitted immediately after the include guard, ahead of every declaration.
#
# It is the CURL_EXTERN definition block, copied from include/curl/curl.h:
# 122-136, and it is here because [fn] below prefixes every declaration with
# CURL_EXTERN to match urlapi.h:113-149. A prefix with no definition would
# leave the generated header uncompilable on its own, which would defeat the
# point of generating it; with the block, the output compiles as a standalone
# header exactly as the committed one does. The #ifndef guard means a
# consumer that has already included curl.h keeps that definition.
after_includes = """
#ifndef CURL_EXTERN
#ifdef CURL_STATICLIB
#define CURL_EXTERN
#elif defined(_WIN32)
#ifdef BUILDING_LIBCURL
#define CURL_EXTERN __declspec(dllexport)
#else
#define CURL_EXTERN __declspec(dllimport)
#endif
#else
#define CURL_EXTERN
#endif
#endif"""

# Which items reach the header at all. The mirror must expose exactly what
# include/curl/urlapi.h exposes, so this section is a filter first and a
# convenience second.
[export]
# Additive only. cbindgen already pulls in every type an exported function
# mentions, so all three of these arrive anyway; naming them states which
# types the public contract consists of, and keeps them in the header even
# if a future refactor stopped mentioning one of them in a signature. It is
# emphatically not a whitelist -- library.rs adds these to the dependency
# set and filters nothing -- so adding a name here can never remove
# anything, and item_types below is where the real restriction lives.
#
# The names are RUST item names, not the C spellings urlapi.h uses. The
# handle is `CurlUrl` in src/ffi.rs, so that is what is named here; writing
# `CURLU` would match no item and the entry would be silently inert, which is
# difference 3 in the divergence list at the top of this file.
include = ["CurlUrl", "CURLUcode", "CURLUPart"]

# Removed by item name, across functions, enums, structs, unions, opaque
# items, typedefs, globals and constants alike.
#
# The first three are real exports of the crate: src/ffi.rs defines them
# because the object file this crate replaces defines them, and lib/http1.c,
# lib/url.c, lib/http.c, lib/doh.c and lib/http2.c call them. They are
# declared for C consumers in lib/urlapi-int.h:28-33, an internal header,
# and they are no part of the public contract. A drop-in has to export them;
# a mirror of urlapi.h must not declare them.
#
# Curl_parse_port is listed for completeness rather than necessity. It
# exists only in unit-test builds, behind lib/urlapi-int.h:36-37, and it is
# out of scope for this port because it takes curl's own struct dynbuf
# across the boundary. Naming it means that if it were ever added to
# src/ffi.rs it still could not leak into the public header by accident.
#
# curl_free is the entry that deserves the explanation. The crate really
# does export it under the cfree feature, because in a standalone link
# nothing else supplies it and the documented contract that a buffer from
# curl_url_get() is released with curl_free() still has to hold. But it
# belongs to include/curl/curl.h's surface, not urlapi.h's, so a one-for-one
# mirror of urlapi.h:34-149 cannot declare it. The consequence is worth
# stating plainly for whoever writes the standalone consumers: in Mode B the
# declaration has to come from the caller's own prototype or from the
# harness shim header, not from this file's output.
#
# The last three are internal implementation constants, not part of any
# public contract, and they are here because "constants" in item_types below
# reaches every `pub const` in the crate rather than only the sixteen flag
# bits it was added for. Without these entries cbindgen emits, measured:
#
#   #define MAX_SCHEME_LEN 40
#   #define CURL_MAX_INPUT_LENGTH 8000000
#   #define PROTOPT_URLOPTIONS (1 << 10)
#
# All three are wrong in a header that mirrors urlapi.h, and one of them is
# actively harmful. CURL_MAX_INPUT_LENGTH and PROTOPT_URLOPTIONS collide
# token-identically with lib/urldata.h:131 and :545 -- benign to a C
# preprocessor, but urldata.h is a *private* header and a public mirror has
# no business restating it. MAX_SCHEME_LEN is the harmful one: it carries no
# prefix at all, so it occupies a name in the global macro namespace of every
# translation unit that includes the mirror.
#
# Fixed here rather than in src/abi.rs. Narrowing the three to `pub(crate)`
# would also work today -- cbindgen only sees an item declared `pub` at its
# definition site -- but src/ffi.rs and src/getset.rs are cross-module
# consumers of all three, so the visibility that suits the crate and the
# visibility that suits the header are different questions and are answered
# in different files. This is the header's file.
#
# Two further constants of src/abi.rs, DEFAULT_SCHEME at :407 and
# DEFAULT_SCHEME_CSTR at :424, need no entry: cbindgen cannot represent a
# `&str` or a `&[u8]` in C and skips them of its own accord. See the note on
# command-line noise near [defines] below, which measures what that costs.
# The ten entries after curl_free are not exports at all -- they are the
# prototypes this crate *imports*. src/ffi.rs is the crate's only unsafe island,
# so every extern "C" block lives there: the libidn2 bindings that lib/idn.c
# L33 gets from <idn2.h>, the address pair that lib/curlx/inet_pton.h L36 gets
# from <arpa/inet.h>, and the two scheme lookups lib/url.h L76-L77 declares.
# cbindgen emits an `extern` declaration for each one, because a declaration is
# what they are, and a mirror of urlapi.h:34-149 must carry none of them. The
# CurlScheme mirror is excluded for the same reason: it is a description of
# struct Curl_scheme at lib/urldata.h L515-L524, which urlapi.h does not
# mention, and the drop-in link gets the real definition from libcurl.
exclude = [
  "Curl_is_absolute_url",
  "Curl_junkscan",
  "Curl_url_set_authority",
  "Curl_parse_port",
  "curl_free",
  "MAX_SCHEME_LEN",
  "CURL_MAX_INPUT_LENGTH",
  "PROTOPT_URLOPTIONS",
  "idn2_check_version",
  "idn2_lookup_ul",
  "idn2_lookup_u8",
  "idn2_to_unicode_8z8z",
  "idn2_free",
  "inet_pton",
  "inet_ntop",
  "Curl_get_scheme",
  "Curl_getn_scheme",
  "CurlScheme",
]

# The real restriction, and the reason no struct body can ever appear in a
# header that mirrors one containing no structs at all. Each entry earns its
# place, and each omission is deliberate:
#
#   constants   the 16 CURLU_* flag bits, and, because src/abi.rs states the
#               33 CURLUE_* and 11 CURLUPart_* values as constants too, those
#               44 as well. cbindgen preserves the shift expression rather
#               than folding it, so `1 << 14` in Rust emits
#               `#define CURLU_GET_EMPTY (1 << 14)`, matching urlapi.h:84-105
#               including the parentheses. Because that works, the flags are
#               generated from the code and the trailer fallback is not used
#               -- see the note at the end of this file. This entry reaches
#               every `pub const` in the crate, not only the ones wanted,
#               which is why three implementation constants are named in
#               [export] exclude above.
#   opaque      the handle, emitted as `struct CurlUrl` from the Rust item
#               name. The Rust handle is an ordinary Rust struct
#               and so is not repr(C), which is precisely what makes
#               cbindgen classify it as opaque and emit a forward
#               declaration with no body, exactly as urlapi.h:107 does.
#   typedefs    any Rust type alias in the public surface. This is what
#               carries CURLUcode and CURLUPart, since `pub type CURLUcode`
#               and `pub type CURLUPart` in src/abi.rs declare them as
#               `c_int` aliases; they arrive as `typedef int CURLUcode;` and
#               `typedef int CURLUPart;`.
#   functions   the six declarations.
#
#   enums       omitted, because it is inert. It was listed here for
#               CURLUcode and CURLUPart, and those two are typedefs rather
#               than enumerations for the ABI reason the doc comments above
#               those two aliases give. Measured: this crate produces 0
#               `typedef enum` blocks, with the entry and without it. It is
#               dropped rather than kept as a no-op so that a future reader
#               cannot mistake it for a statement that enumerations are
#               expected here.
#   structs     omitted, and this is the structural guarantee that the
#               opaque handle can never acquire a body. If a future change
#               made the handle repr(C), cbindgen would reclassify it as a
#               struct and want to print its fields; with "structs" absent
#               it simply is not generated, and the missing declaration
#               shows up in the diff instead of the field list leaking into
#               the ABI contract.
#   unions      omitted for the same reason. urlapi.h declares none.
#   globals     omitted. The crate exports no mutable global, and a header
#               that declared one would be describing a surface the C
#               original does not have.
#
# One coupling with the Rust side follows from listing "constants", and it is
# worth stating because it is silent when it goes wrong: cbindgen only sees
# an item declared `pub` at its definition site. A flag written as
# `pub(crate) const` simply does not appear -- generating with one of the
# sixteen changed that way produced fifteen #define lines rather than sixteen
# -- and a `pub use` re-export of a `pub(crate)` constant does not rescue it
# either. Both were tried. So the 16 CURLU_* constants have to be `pub` where
# they are defined. If a diff against the committed header ever shows flags
# missing, that is the first thing to check, and the fix belongs in the Rust
# source rather than here.
item_types = ["constants", "opaque", "typedefs", "functions"]

# Moot while both the rename table and the prefix are empty, and set
# explicitly so the interaction between them is on the record rather than
# left to be rediscovered: with this false a rename would still have the
# prefix applied on top of it.
renaming_overrides_prefixing = false

# There is deliberately no `prefix` key in this section. A prefix would turn
# CURLUcode into something else and every symbol with it, which is an ABI
# break of the plainest kind. The absence is the setting.

# One entry, and it is the exception that proves the rule. Every other name
# has to arrive in C exactly as the Rust item spells it: curl_url,
# curl_url_cleanup, curl_url_dup, curl_url_get, curl_url_set,
# curl_url_strerror, and the types CURLUcode and CURLUPart. Callers link
# against those names and switch on those types numerically, so any further
# entry below would be an ABI break rather than a cosmetic change.
#
# The handle is the one name where the Rust item and the C contract disagree
# by design. src/handle.rs calls the type CurlUrl, because that is the name a
# Rust reader of that module needs and because the crate documentation refers
# to CurlUrl::dup and the fourteen members by that name throughout.
# include/curl/urlapi.h:107 calls it CURLU. Without this line cbindgen emits
# `typedef struct CurlUrl CurlUrl;` and then spells all five handle-taking
# declarations `CurlUrl *`, which is a name no caller has ever compiled
# against. The rename is therefore not cosmetic tidying: it is what makes the
# generated declarations the same declarations.
#
# What it does NOT fix, and what build.rs's surface comparison therefore
# normalizes away instead: the struct TAG. cbindgen derives the tag from the
# item name and so emits `typedef struct CURLU CURLU;` where urlapi.h:107
# writes `typedef struct Curl_URL CURLU;`. No key here can set a tag
# independently of the name. It is ABI-irrelevant because the type is
# incomplete either way and is only ever used through a pointer -- which is
# the property that makes this whole port tractable -- and normalization 5 in
# `mod mirror_header::surface` records exactly that.
[export.rename]
CurlUrl = "CURLU"

# No mangling of any kind. Note the narrow reach of this section, which its
# name does not advertise: both keys govern only the names cbindgen invents
# for itself, that is the names it synthesises when monomorphising a generic
# type (mangle.rs) and the separator it uses when building the union members
# of a tagged enum (enumeration.rs). Neither touches an ordinary item name --
# CURLUcode and CURLU_DEFAULT_PORT are safe from them regardless, and the
# keys that could rewrite those are [export.rename] and the absent `prefix`
# above. Nothing in this crate's public surface is generic and neither
# enumeration carries data, so both settings are inert today. They are pinned
# to their neutral values so that a generic entering the surface later cannot
# have a name invented for it in a shape the published contract does not use.
[export.mangle]
# No case conversion on a synthesised type name.
rename_types = "None"
# Keep the underscore separator in a synthesised name rather than dropping
# it, which is what cbindgen's own internal defaults do.
remove_underscores = false

# Parity for the two enumerations is positional. The numbers are not written
# in urlapi.h at all -- CURLUE_OK has no `= 0` and the values emerge purely
# from declaration order, with the trailing /* n */ comments as commentary
# rather than as definitions. Every setting here exists to stop cbindgen
# adding to, renaming or renumbering that sequence.
[enum]
# No case conversion on variant names. CURLUE_BAD_PARTPOINTER and
# CURLUPART_ZONEID are spelled the way callers spell them.
rename_variants = "None"

# Applies only to the union fields cbindgen synthesises for Rust enums that
# carry data. Both enumerations here are fieldless, so nothing is affected;
# pinned to "None" so that the default, SnakeCase, cannot start renaming
# something if the shape of these types ever changes.
rename_variant_name_fields = "None"

# The single most important line in this section, and the one setting here
# whose wrong value silently changes the ABI in C as well as in C++. Turning
# it on appends a variant literally named `Sentinel` to both enumerations,
# after CURLUE_LAST and after CURLUPART_ZONEID, so it takes the values 33 and
# 11 -- confirmed by generating with it on. Both are unassigned in the C
# original, CURLUE_LAST is itself the sentinel at 32, and a value in the ABI
# that no caller and no version of libcurl knows about is exactly the kind of
# addition this port must not make.
add_sentinel = false

# Would emit CURLUcode_CURLUE_OK instead of CURLUE_OK, and
# CURLUPart_CURLUPART_URL instead of CURLUPART_URL. Every existing caller
# would stop compiling.
prefix_with_name = false

# The whole derive family is off. These generate constructors, IsX() and
# AsX() accessors, destructors, copy constructors, copy assignment and an
# ostream serialiser for tagged enums. Two things make them inert here:
# enumeration.rs returns early on `language != Language::Cxx`, so they only
# ever fire for C++, and both enumerations are plain C enumerations carrying
# no payload in any case. They are all stated because their combined effect,
# if one ever did fire, is to add members and symbols to a contract that must
# gain neither -- and because a reader who finds only some of them listed
# would reasonably wonder about the rest.
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
derive_tagged_enum_copy_assignment = false
derive_ostream = false
private_default_tagged_enum_constructor = false

# The one cbindgen default that is true rather than false, pinned here for
# defence in depth rather than for effect. It is honoured only when language
# is C++ -- enumeration.rs writes `enum class` under Language::Cxx alone, and
# bindings.rs gates it on the same test -- so with language = "C" above it
# changes nothing in today's output, which was confirmed by generating with
# it both ways. What pinning it buys is that switching the language could not
# quietly produce `enum class CURLUcode`, which would make an unqualified
# CURLUE_OK an error and would refuse the implicit conversion to int that
# every C caller of this API performs. Note that the mirror is still consumed
# from C++, through the cpp_compat wrapper, which is why the C++ side is
# worth defending even though the emitted language is C.
enum_class = false

# There are no must_use, deprecated, deprecated_with_note,
# deprecated_variant, deprecated_variant_with_note or cast_assert_name keys
# in this section. Each would decorate the output with an attribute or a
# macro that urlapi.h does not carry, and the mirror carries nothing extra.

[fn]
# "auto" keeps a declaration on one line when it fits inside line_length and
# breaks it one argument per line when it does not. So curl_url(),
# curl_url_cleanup(), curl_url_dup() and curl_url_strerror() stay on one
# line as at urlapi.h:113, 120, 126 and 149, while curl_url_get() and
# curl_url_set() wrap. The original wraps those two at two arguments per
# line (133-134, 141-142) and cbindgen cannot reproduce that shape, but
# "auto" is what keeps every line inside 79 columns, which is the part that
# matters to checksrc.
args = "auto"

# Keep the parameter names exactly as src/ffi.rs writes them, so `handle`,
# `what`, `part` and `flags` arrive as urlapi.h spells them.
#
# Two names it cannot carry across, which is difference 7 in the list at the
# top of this file. urlapi.h:126 spells curl_url_dup's parameter `in`, a Rust
# keyword, and rename_args cannot turn a name back into a reserved word;
# urlapi.h:149 leaves curl_url_strerror's unnamed, and Rust has no unnamed
# parameter to write. src/ffi.rs spells them `input` and `code`, so those are
# what the generated header shows. The unnamed declaration is the one
# cosmetic defect the port is required to reproduce rather than improve, and
# it is reproduced in the committed mirror header -- which is hand-authored
# precisely so that it can be.
rename_args = "None"

# Restates the top-level choice so functions cannot inherit a different
# default. See the sort_by note above for why sorting is refused.
sort_by = "None"

# The prefix every declaration in include/curl/urlapi.h:113-149 carries.
#
# Without it cbindgen emits bare `CURLU *curl_url(void);` and the generated
# header stops matching the public one at the very first token of every
# declaration -- measured. With it the output reads
# `CURL_EXTERN CURLU *curl_url(void);` exactly as urlapi.h:113 does.
#
# A prefix naming a macro nothing defines would leave the header
# uncompilable, which is why after_includes above emits the CURL_EXTERN
# definition block from include/curl/curl.h:122-136. The two keys are one
# decision and must be changed together.
prefix = "CURL_EXTERN"

# There are no postfix, must_use, deprecated, deprecated_with_note,
# swift_name_macro or no_return keys here. urlapi.h attaches none of those to
# any of its six declarations, and the mirror must not invent one.

[const]
# Both of these only bite in C++ mode, and both are turned off so that a
# constant is always a #define. That is what urlapi.h:84-105 uses, and it is
# also the only form in which the (1 << n) spelling survives: a static const
# or a constexpr would have to name a type, and the flags are passed as an
# unsigned int bit mask rather than as values of a type.
allow_static_const = false
allow_constexpr = false

# Restates the top-level choice. Sorting here is what would put the 16 flags
# in alphabetical rather than bit order.
sort_by = "None"

[parse]
# Do not follow dependencies. The crate depends on libc, and on idna when
# the idn-pure feature is selected; neither contributes anything to this
# header, and parsing them could only add declarations the C original does
# not have. It is also what keeps generation fast and offline.
parse_deps = false

# Both empty, and both stated so the emptiness reads as a decision rather
# than an omission. With parse_deps off there is nothing to exclude, and no
# dependency is permitted to contribute a constant, a static item or a
# function of its own.
exclude = []
extra_bindings = []

# Do not use a fresh temporary target directory. There is nothing to expand,
# so there is no build to isolate.
clean = false

# There is deliberately no [parse.expand] section and no `include` key. The
# expansion path shells out to `rustc -Zunpretty=expanded`, which needs a
# nightly toolchain, and rust-toolchain.toml pins the stable channel on
# purpose. Nothing in this crate hides a C-visible item inside a macro, so
# there is nothing to expand. The `include` key is omitted rather than set
# to an empty list because an empty list is a different thing from no list:
# it would be an empty crate whitelist rather than the absence of one.

[macro_expansion]
# Do not expand the bitflags macro. The 16 CURLU_* values are plain
# constants in src/abi.rs, not a bitflags! type, and expansion would emit a
# struct with a value field instead of the 16 #define lines that
# urlapi.h:84-105 declares.
bitflags = false

# Empty, deliberately, and this key does not mean what its name suggests.
#
# In cbindgen a [defines] entry maps a Rust #[cfg] predicate onto a C
# preprocessor macro name, so that a cfg-gated item comes out wrapped in
# `#if defined(THAT_MACRO)`. It is not a way to emit a #define; the 16
# CURLU_* flag bits are generated from the constants in src/abi.rs, as the
# item_types note above explains.
#
# Two cfg predicates exist in src/ffi.rs, for the strerror and cfree
# features, and neither gets an entry:
#
#   - curl_free is excluded from the header outright, so its cfg never
#     reaches the writer at all.
#   - curl_url_strerror must appear, because urlapi.h:149 declares it, and
#     urlapi.h declares it unconditionally. An entry here would wrap it in
#     `#if defined(...)` and hide it from every standalone consumer that did
#     not happen to define the macro. Leaving the entry out is what makes
#     the mirror declare all six public functions unconditionally, in every
#     build configuration, exactly as the original does -- which is right
#     even in Mode A, where the crate does not export curl_url_strerror at
#     all because lib/strerror.c:420-531 already does.
#
# The cost is noise, and only from the command-line tool. cbindgen installs
# its logger in its own binary and nowhere else, so used as a library from
# build.rs -- the genheader path, and the one that actually runs -- every
# message below is a no-op. The generated bytes are identical either way,
# which is the only thing this file is answerable for.
#
# The noise is measured rather than estimated, because an understated figure
# invites the reader to think something has gone wrong when they see more.
# Three categories appear, all at warning level, and none of them is
# actionable:
#
#   Missing `[defines]` entry for `<predicate>`   one line per cfg-gated item
#     cbindgen walks, so it counts cfg predicates rather than features. On
#     this crate: the two above plus `idn_backend_libidn2` and `unix` in
#     src/idn.rs and src/inet.rs, which are not features at all and for which
#     an entry would be actively wrong.
#
#   Skip <name> - (not `pub`)   one line per crate-internal item, and by far
#     the largest group, because everything outside src/ffi.rs is
#     `pub(crate)` by design. It grows with the crate and says only that the
#     export surface is as narrow as it is meant to be.
#
#   Skip <name> - (Unsupported ...)   exactly two, for `DEFAULT_SCHEME`, a
#     `&str`, and `DEFAULT_SCHEME_CSTR`, a `&[u8]`, both in src/abi.rs.
#     Neither has a C representation, and neither should reach the mirror.
#     Worth stating because it is counter-intuitive: naming them in [export]
#     exclude does NOT silence these two lines. Verified by doing it. The
#     message is emitted while cbindgen parses, before the export filter is
#     consulted, so exclusion can remove an item from the output but not a
#     complaint from the log. That is why they are absent from the exclude
#     list above -- an entry that changes nothing does not earn its place --
#     and why the count is recorded here instead.
[defines]

# The tables and keys this file omits are omitted because they do not apply:
# no struct, packed or aligned type reaches the public surface; the mirror
# declares C, so the C++ and Cython keys are irrelevant; pointer non-null
# annotations are deliberately absent because urlapi.h has none and the
# API expresses null handling as behaviour, CURLUE_BAD_HANDLE for a null
# handle and CURLUE_BAD_PARTPOINTER for a null part pointer; and a
# do-not-edit banner is omitted because the committed header is
# hand-maintained, so a banner would make every regeneration diff noise.
#
# [defines] above is the last table header in the file, so a key appended
# past this point would join that table rather than the top level;
# anything new belongs beside the bare keys near the top.
