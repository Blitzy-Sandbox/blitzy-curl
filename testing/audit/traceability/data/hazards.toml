#
# One row per hazard the oracle carries.                                DL-0110
# Verdict, owner and compensating verification only; no rationale.      DL-0110

schema = 1

# Annotation markers the discovery pass scans for.                     DL-0225
# Acronyms match whole words and case; phrases ignore case.            DL-0225
annotation-markers = ["FIXME", "HACK", "KLUDGE", "TODO", "WORKAROUND", "XXX"]
annotation-phrases = [
  "cannot happen",
  "deliberate",
  "for now",
  "never happen",
  "on purpose",
  "should not happen",
  "silently",
]

[[hazard]]
id = "HZ-0001"
path = "original/lib/setup-vms.h"
lines = [83, 101]
behaviour = "The non-void path translator can reach the end of the function after a successful translation, so the value it returns is indeterminate."
verdict = "not-ported"
owner = "none"
verification = "Platform matrix excludes OpenVMS; the construct carries a traceability row and no counterpart."
status = "obligation"
decision = "DL-0052"

