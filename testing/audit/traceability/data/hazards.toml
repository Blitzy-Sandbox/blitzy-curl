# ---------------------------------------------------------------------------
# Divergence allowlist entries, one per diverge verdict.               DL-0231
# Locator and behaviour come from the hazard row.                      DL-0231
# ---------------------------------------------------------------------------

[[divergence]]
id = "DV-0001"
hazard = "HZ-0002"
outcome = "The conversion answers the out-of-memory code and no address list; a caller never sees a successful resolution that produced nothing."
rationale = "Safe Rust cannot express a successful return beside an absent result: the conversion answers a result type, so the empty-success state has no representation to reproduce. The chosen code is the one the allocation failure would have produced had it been carried, so every caller path already handles it."
owner = "curl-dns"
decision = "DL-0113"

[[divergence]]
id = "DV-0002"
hazard = "HZ-0011"
outcome = "A failed status call answers not-a-directory, the outcome the zeroed buffer produces on the platforms in the matrix, and the buffer is never read outside the guard."
rationale = "Reading an indeterminate buffer is undefined behaviour that safe Rust cannot perform, so the value the oracle reads cannot be reproduced. Not-a-directory is the deterministic choice: it keeps the transfer on the path the oracle takes whenever the buffer happens to be zeroed, which is what the upstream cases exercise."
owner = "curl-proto-file"
decision = "DL-0113"

[[divergence]]
id = "DV-0003"
hazard = "HZ-0031"
outcome = "The conversion answers the out-of-memory code, and a partial list is discarded rather than returned."
rationale = "The oracle records the failure in a local it then discards, which safe Rust cannot mirror without inventing a second channel. Answering the code the oracle computed and dropped is the only outcome that is both deterministic and consistent with the code it wrote down."
owner = "curl-dns"
decision = "DL-0113"

[[divergence]]
id = "DV-0004"
hazard = "HZ-0045"
outcome = "A name-decode failure answers the decode error the parser produced rather than the out-of-memory code the oracle's uninitialised result variable carries."
rationale = "Reproducing the oracle here would mean seeding a result variable with a code unrelated to the failure and letting it survive, which is the shape safe Rust removes by construction: the decode answers a result and the caller propagates it. The divergence is visible only in which error a malformed answer reports, never in whether the transfer fails."
owner = "curl-dns"
decision = "DL-0119"

[[divergence]]
id = "DV-0005"
hazard = "HZ-0046"
outcome = "Trailing bytes after a complete answer are rejected in every build, which is the debug build's behaviour, so one build type answers for both."
rationale = "A port whose behaviour depends on whether assertions are compiled in would have to carry the release acceptance and the debug rejection as two contracts, and the harness runs debug builds, so the stricter of the two is the one every upstream case already asserts. Choosing the looser one would leave the assertion unreachable and the strictness untested."
owner = "curl-dns"
decision = "DL-0119"

[[divergence]]
id = "DV-0006"
hazard = "HZ-0047"
outcome = "The peer's shutdown last-stream and error values are taken from the frame the substitute library reports, so a non-zero field is reported as sent rather than as the initialisation value."
rationale = "The replacement HTTP/2 implementation surfaces those fields through its own event, and discarding them to reproduce the oracle's unassigned locals would mean deliberately dropping data the substitute gives us. The tunnel outcome is unchanged either way, and the boundary difference is enumerated in the dependency-delta deliverable."
owner = "curl-http2"
decision = "DL-0128"

[[divergence]]
id = "DV-0007"
hazard = "HZ-0073"
outcome = "The promise store bounds the total byte size of the headers it holds as well as their count, and answers the stream error the count limit already answers when either bound is exceeded."
rationale = "An unbounded aggregate is a memory-exhaustion surface a peer controls, and the substitute library gives no equivalent cap, so reproducing the absence would import a denial of service the replacement cannot mitigate. The added bound is reported through the error the count limit already uses, so no new outcome appears; the difference is which promises are refused."
owner = "curl-http2"
decision = "DL-0125"

[[divergence]]
id = "DV-0008"
hazard = "HZ-0154"
outcome = "A hash-construction failure answers the out-of-memory code and no session-setup message is sent; no key material is derived from an unwritten buffer."
rationale = "The oracle turns an allocation failure into twenty-four bytes of indeterminate memory on the wire, derived from three DES keys built out of an unwritten buffer. Safe Rust cannot read an uninitialised buffer, and sending key material derived from one is a disclosure the port must not reproduce even bug for bug. Answering the failure is the only deterministic outcome that keeps the wire silent."
owner = "curl-proto-smb"
decision = "DL-0181"

[[divergence]]
id = "DV-0009"
hazard = "HZ-0292"
outcome = "The relay proves the peer before it forwards anything: the tool writes random bytes over the connection it made and the thread forwards standard input only to a peer that presents them, closing any other, which is the check original/docs/KNOWN_BUGS.md:108-121 names and the one original/lib/socketpair.c:210-220 already performs. A legitimate upload is byte for byte what the oracle produces, on standard output, on standard error, in the exit status and in the bytes the server receives."
rationale = "The oracle hands the whole upload body to whichever local process reaches an ephemeral loopback port first, which is a disclosure of user data the port must not reproduce even bug for bug, the same ground on which DV-0008 refuses to put key material from an unwritten buffer on the wire. Upstream has recorded the defect and prescribed this exact remedy, so the divergence adopts the oracle's own stated intent rather than inventing a policy; the relay is an internal transport for standard input, not part of the command-line contract or the ABI, so nothing a legitimate run can observe changes, and the difference is visible only to a racing local attacker, which no upstream case, corpus or gate exercises."
owner = "curl-cli"
decision = "DL-0240"
