# SPDX-FileCopyrightText: the blitzy-curl project contributors
# SPDX-License-Identifier: curl
#
# The observability contract: what the oracle already provides and the port
# reuses, what this project adds, and every place a value the oracle traces is
# a credential. Read by testing/audit/traceability; rationale lives in
# refactor/docs/DECISION-LOG.md. Every locator here is verified against the
# vendored oracle on each run, so a stale line number fails rather than misleads.

schema = 1

# Field names no added instrumentation may carry. DL-0232.
sensitive-fields = [
  "authorization",
  "challenge",
  "cookie",
  "credential",
  "header",
  "netrc",
  "passphrase",
  "passwd",
  "password",
  "payload",
  "peer_key",
  "sdata",
  "secret",
  "session_id",
  "session_key",
  "shmac",
  "ticket",
  "token",
  "user",
  "username",
]

# Instrumentation call shapes the sensitive-field gate scans for. DL-0232.
instrumentation-macros = [
  "counter!",
  "debug!",
  "debug_span!",
  "error!",
  "error_span!",
  "event!",
  "gauge!",
  "histogram!",
  "info!",
  "info_span!",
  "instrument",
  "span!",
  "trace!",
  "trace_span!",
  "warn!",
  "warn_span!",
]

# Format-string shapes that make a shared-sink call site a disclosure. DL-0232.
# A shape matches when the call's first string literal equals `format` and,
# where `argument` is given, the text after that literal contains it.
[[shape]]
format = "USER %s"
class = "credential"
discloses = "the account name"

[[shape]]
format = "PASS %s"
class = "credential"
discloses = "the password in the clear"

[[shape]]
format = "APOP %s %s"
class = "credential"
discloses = "the account name and the MD5 digest derived from the password"

[[shape]]
format = "LOGIN %s %s"
class = "credential"
discloses = "the account name and the password in the clear"

[[shape]]
format = "AUTH %s %s"
class = "credential"
discloses = "the mechanism and the base64 initial response"

[[shape]]
format = "AUTHENTICATE %s %s"
class = "credential"
discloses = "the mechanism and the base64 initial response"

[[shape]]
format = "%s"
argument = "Curl_bufref_ptr(resp)"
class = "credential"
discloses = "one base64 continuation of the mechanism exchange"

[[shape]]
format = "AUTH %s"
class = "mechanism"
discloses = "the mechanism the client selected, carrying no secret"

[[shape]]
format = "AUTHENTICATE %s"
class = "mechanism"
discloses = "the mechanism the client selected, carrying no secret"

