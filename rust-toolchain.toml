# Toolchain pin.                                                       DL-0025
# Comments are labels or DL-#### pointers only.                        DL-0023
#
# MIRI-TOOLCHAIN: nightly-2026-08-11
# MIRI-COMPONENTS: miri rust-src

[toolchain]
# Exact three-component release; never `stable`, never `nightly`.      DL-0007
# Equals `rust-version` and `workspace.metadata.curl.msrv`.               [R1]
channel = "1.97.1"                                                    # DL-0025
profile = "minimal"

# `minimal` omits both.                                                  [R12]
components = ["clippy", "rustfmt"]

# Execution-verified: the two linux-gnu targets.                          [R12]
# Cross-compiled and link-verified: darwin and windows-msvc.              [R12]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
