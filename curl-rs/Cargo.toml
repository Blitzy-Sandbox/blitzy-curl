# =============================================================================
# curl-rs — binary (CLI) crate manifest
# =============================================================================
#
# `curl-rs` is the command-line binary crate of the curl-rs workspace: the
# drop-in, memory-safe Rust reimplementation of curl's C CLI tool (the `src/`
# tree, entrypoint `src/tool_main.c`). Building this crate yields the `curl-rs`
# executable, which IS the drop-in `curl` — it is installed/symlinked as `curl`
# at deploy time. The cargo target is deliberately NOT named `curl`, so it never
# collides with a system `curl` on PATH during development.
#
# There is no 1:1 C-source equivalent for this manifest; its structural analog
# is the CLI build file `src/CMakeLists.txt`, which declares
# `add_executable(${EXE_NAME} …)` and links the selected curl library via
# `target_link_libraries(${EXE_NAME} ${LIB_SELECTED_FOR_EXE} …)`. Here that
# becomes the `[[bin]]` target below plus the single internal dependency on
# `curl-rs-lib`.
#
# Dependency direction (AAP §0.1.1 / §0.4 — STRICTLY one-directional):
#   * `curl-rs` depends on `curl-rs-lib` ONLY (imported in code as
#     `use curl_rs_lib::…`; package-name dashes become underscores).
#     `curl-rs-lib` provides every transfer / protocol / option setter the CLI
#     drives.
#   * `curl-rs` MUST NOT depend on the workspace's FFI crate. The two leaf
#     crates (this CLI binary and the FFI/ABI crate) never reference each other;
#     both depend only on the core library.
#
# Version inheritance (single source of truth):
#   Every dependency version and every shared [package] field is inherited from
#   the workspace root `/Cargo.toml` via `<field>.workspace = true` and
#   `<dep> = { workspace = true, … }`. This manifest pins NO versions of its own
#   — there are zero literal "x.y.z" version strings below (outside comments) so
#   the workspace root remains the only place versions are declared.
#
# Human-facing version string:
#   curl's version string is "8.19.0-DEV" (numeric form 0x081300, MAJOR=8
#   MINOR=19 PATCH=0, from include/curl/curlver.h). Cargo's SemVer
#   `version` field cannot carry curl's "-DEV" pre-release marker (a literal
#   "8.19.0-DEV" here would be read as a SemVer pre-release and sort *below*
#   "8.19.0"), so the workspace pins the numeric "8.19.0" and the exact
#   "8.19.0-DEV" string reported by `curl-rs --version` is owned by the core
#   crate's version module (`curl_rs_lib::version`), not by this manifest.
#
# CLI parity (hard preservation constraint, AAP §0.8.2):
#   curl 8.x flag names, semantics, and defaults are immutable — `curl --help
#   all` parity. This manifest only declares the parsing dependencies (`clap` /
#   `clap_complete`); the 1:1 fidelity to curl's ~282-entry option table (the
#   `aliases[]` table in `src/tool_getparam.c`) is enforced in `src/args.rs`.
#
# TLS:
#   `rustls` is the EXCLUSIVE TLS backend and is owned by `curl-rs-lib`. This
#   binary links no TLS or other C-library bindings of its own (AAP §0.8.1;
#   enforced by the workspace `deny.toml`). The FFI-only crates (the C
#   primitive-types crate and the C-header generator) are likewise absent here.
#
# `Cargo.lock` is generated by Cargo at the workspace root — it is never
# hand-authored in this crate (`is_dependency_file = true`).
# =============================================================================

[package]
# Must match the workspace member entry exactly (root `members = [… "curl-rs" …]`).
name = "curl-rs"

# All shared metadata is inherited from the root [workspace.package] — never
# re-pinned here (the workspace is the single source of truth, AAP §0.6.1).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# Crate-specific description (the binary crate overrides the generic workspace
# description, exactly as the core crate does for itself).
description = "curl-rs — the command-line binary crate of the curl-rs workspace; a drop-in, memory-safe Rust reimplementation of the curl CLI tool (src/)."

# With a single binary target, this makes `cargo run` / `cargo install`
# unambiguous.
default-run = "curl-rs"

# -----------------------------------------------------------------------------
# Binary target — produces the drop-in `curl`.
#
# The executable is named `curl-rs` (NOT `curl`) to avoid colliding with a
# system `curl` during development; the drop-in identity is achieved at install
# time by symlinking/renaming to `curl`, not via the cargo target name. This
# matches the README build instruction
# `cargo run --release --bin curl-rs -- https://example.com`. `src/main.rs` is
# the entrypoint — the Rust analog of `src/tool_main.c`
# (`main()` → `operate()` → `return (int)result;`, so the process exit code is
# the numeric curl error code).
# -----------------------------------------------------------------------------
[[bin]]
name = "curl-rs"
path = "src/main.rs"

# -----------------------------------------------------------------------------
# Inherit the workspace-wide lint policy (root [workspace.lints], which the root
# manifest invites every member to opt into). It enables
# `unsafe_op_in_unsafe_fn = "deny"`. This CLI crate contains no `unsafe` of its
# own (all raw-pointer / FFI handling lives in the separate FFI crate), so the
# lint is a no-op here, but opting in keeps the policy uniform across all three
# workspace members and reinforces the memory-safety mandate (AAP §0.7.1).
# -----------------------------------------------------------------------------
[lints]
workspace = true

# =============================================================================
# [dependencies] — runtime dependencies of the CLI binary.
#
# Every entry inherits its EXACT version from the root [workspace.dependencies]
# via `workspace = true`; only `features` are set locally (and any features
# requested here are additive with those the workspace declares). Core-internal
# crates (the HTTP/QUIC/SSH engines, the TLS stack, the crypto primitives, URL /
# IDN / PSL handling, byte buffers, sockets, the `http` types) are intentionally
# absent — they belong to `curl-rs-lib` and reach the CLI transitively through
# it. The FFI-only crates are absent too (dependency direction, AAP §0.4).
# =============================================================================
[dependencies]

# ---- internal core (the ONLY internal dependency) ---------------------------
# Provides every transfer / protocol / option-setter the CLI drives, plus the
# human-facing version string. Depended on with DEFAULT features so the binary's
# `--version` capability + protocol reporting equals curl's default build
# (AAP §0.6.2) — default features are NOT disabled here. Imported in code as
# `use curl_rs_lib::…`.
curl-rs-lib.workspace = true

# ---- CLI argument parsing (→ src/args.rs) -----------------------------------
# The clap model is derived one-to-one from curl 8.x's option inventory; flag
# names / semantics / defaults are immutable (AAP §0.8.2). The feature set is
# kept minimal & parity-driven:
#   derive    — the struct-based option model used by `src/args.rs`;
#   string    — owned (runtime-built) command/arg/help strings, needed for
#               curl-style dynamically composed help & version text;
#   wrap_help — wrap long help output to the terminal width, like
#               `curl --help all`;
#   cargo     — exposes the crate version/name to the help & version templating.
# Only stable features are enabled (minimal-change mandate, AAP §0.8.1).
clap = { workspace = true, features = ["derive", "string", "wrap_help", "cargo"] }

# Shell-completion generation (curl ships completions; AAP §0.6.1) — drives the
# CLI's completion-emitting path.
clap_complete.workspace = true

# ---- async runtime — CLI entrypoint (→ src/main.rs) -------------------------
# `src/main.rs` uses `#[tokio::main(flavor = "current_thread")]` (AAP §0.4.4):
# a lightweight single-threaded runtime sufficient for one-shot CLI transfers.
#   rt     — the current-thread runtime + `block_on`;
#   macros — the `#[tokio::main]` attribute macro.
# The multi-thread runtime lives in the core crate's `Multi`, so only the
# current-thread runtime is requested here; the feature set is kept minimal (no
# umbrella feature set) per the minimal-change mandate (AAP §0.8.1).
tokio = { workspace = true, features = ["rt", "macros"] }

# ---- error handling & output ------------------------------------------------
# `anyhow`: ergonomic error propagation / diagnostics in the CLI layer
# (AAP §0.6.1). IMPORTANT: the process exit code MUST equal curl's numeric error
# code (`return (int)result;`, src/tool_main.c:203). `anyhow` is for
# human-facing diagnostics only and must not collapse distinct exit codes — the
# numeric code is preserved by `operate()` / `main()` (enforced in
# `src/operate.rs` & `src/main.rs`, not in this manifest).
anyhow.workspace = true

# `serde` + `serde_json`: config (de)serialization and the structured
# `--write-out` JSON surface (`%{json}` / `%{header_json}` in
# `src/writeout_json.rs`), AAP §0.6.1. (The byte-exact `%{json}` escaping in
# `writeout_json.rs` is hand-rolled to preserve test-suite parity; serde backs
# the structured config / serialization paths.)
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# `glob`: filesystem path matching for curl's file globbing on
# `-T` / `--upload-file` and `-o` / `--output` (AAP §0.6.1). NOTE: curl's URL
# `{a,b}` / `[1-10]` glob grammar (`src/tool_urlglob.c` → `src/urlglob.rs`) is
# curl's OWN syntax and is implemented directly, NOT via this crate.
glob.workspace = true

# `chrono`: CLI-side date formatting for the `--write-out` `%{time_*}` fields and
# `-z` / `--time-cond` input parsing (AAP §0.6.1).
chrono.workspace = true

# ---- verbose / trace logging ------------------------------------------------
# `tracing`: emits structured verbose/trace events from the CLI, backing curl's
# `-v` / `--trace` / `--trace-ascii` and the debug callback
# (`src/callbacks/debug.rs`).
tracing.workspace = true

# `tracing-subscriber`: THIS binary crate owns subscriber setup — `curl-rs-lib`
# deliberately excludes it and only emits events. `src/main.rs` initializes the
# subscriber that renders verbose/trace output to stderr.
tracing-subscriber.workspace = true

# =============================================================================
# [dev-dependencies] — CLI end-to-end / integration tests (AAP §0.8.4 step 12).
# `curl-rs-lib` explicitly delegates the binary-driving test helpers to this
# crate, so exactly these three appear here.
# =============================================================================
[dev-dependencies]
# Spawn & drive the compiled `curl-rs` binary in integration tests.
assert_cmd.workspace = true
# Assert on the binary's stdout / stderr / exit code — the observable-behavior
# parity surface (AAP §0.7.3).
predicates.workspace = true
# Temp files / dirs for output (`-o`) and upload (`-T`) tests.
tempfile.workspace = true
