# SPDX-License-Identifier: curl
# SPDX-FileCopyrightText: Daniel Stenberg, <daniel@haxx.se>, et al.
#
# Root workspace manifest.                                             DL-0026
# Comments are labels or DL-#### pointers only.                        DL-0023
#
# Trees at root: original/, refactor/, testing/.                       DL-0020
# Virtual manifest; contracts sit in [workspace.metadata.curl].        DL-0026

[workspace]
resolver = "3"                                                        # DL-0025

# Membership carries the lints, the pins and the gates.                DL-0031
# Appended by the operation that creates each manifest.                DL-0031
members = ["testing/audit"]

# C source, not a Cargo package; never a member.                        [R1]
exclude = ["original"]

# `testing/fuzz` is a member, not an `exclude` entry.                   DL-0027
# Completeness contract: `required-members`.                           DL-0026

[workspace.package]
version = "8.21.0"                                                    # DL-0001
edition = "2024"                                                      # DL-0025
rust-version = "1.97.1"
license = "curl"
repository = "https://github.com/Blitzy-Sandbox/blitzy-curl"
homepage = "https://curl.se/"
authors = [
  "Daniel Stenberg <daniel@haxx.se>",
  "curl contributors",
  "blitzy-curl maintainers",
]
publish = false

# ---------------------------------------------------------------------------
# Lints. Members opt in with `[lints] workspace = true`.
# `unsafe_code` is `deny`; roots opt in or out explicitly.             DL-0011
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"                                                  # DL-0011
unsafe_op_in_unsafe_fn = "deny"                                       # DL-0011
trivial_casts = "deny"                                                # DL-0023
trivial_numeric_casts = "deny"                                        # DL-0023
unused_must_use = "deny"
non_ascii_idents = "deny"
unexpected_cfgs = "deny"
unused_lifetimes = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
# Lint groups carry an explicit negative priority.
nonstandard_style = { level = "deny", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }             # DL-0025

[workspace.lints.clippy]
cast_possible_truncation = "deny"                                     # DL-0023
cast_possible_wrap = "deny"                                           # DL-0023
cast_sign_loss = "deny"                                               # DL-0023
cast_lossless = "deny"                                                # DL-0023
cast_precision_loss = "deny"                                          # DL-0023
checked_conversions = "warn"                                          # DL-0023
undocumented_unsafe_blocks = "deny"                                   # DL-0011
missing_safety_doc = "deny"                                           # DL-0011
ptr_offset_with_cast = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# ---------------------------------------------------------------------------
# Dependency pins. Exact `=x.y.z` only.                                  [R1]
# Frozen at import: append only.                                         [R1]
#
# `optional` is illegal here; members gate in their own manifest.      DL-0031
# ---------------------------------------------------------------------------
[workspace.dependencies]

# -- curl-rt : the runtime facade --------------------------------------------
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }   # DL-0002
tokio-util = "=0.7.19"                                                # DL-0002
futures-util = "=0.3.33"                                              # DL-0002

# -- shared buffer type ------------------------------------------------------
bytes = "=1.12.1"

# -- curl-tls : coupled release set, single crypto provider ------------------
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }   # DL-0009
rustls-native-certs = "=0.8.4"
rustls-pemfile = "=2.2.0"
webpki-roots = "=1.0.9"
# Recorded transitives of the coupled set, pinned directly.             DL-0009
rustls-webpki = "=0.103.13"                                           # DL-0009
rustls-platform-verifier = "=0.7.0"                                   # DL-0009

# -- curl-http2 / curl-http3 : reached only through curl-rt ------------------
h2 = "=0.4.15"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
quinn = { version = "=0.11.11", default-features = false, features = ["ring", "rustls", "runtime-tokio", "log"] }   # DL-0009

# -- curl-core : content encoding --------------------------------------------
flate2 = "=1.1.9"
brotli = "=8.0.4"
zstd = "=0.13.3"

# -- curl-dns ----------------------------------------------------------------
hickory-resolver = "=0.26.1"
c-ares = "=13.0.0"

# -- curl-url ----------------------------------------------------------------
idna = "=1.1.0"
percent-encoding = "=2.3.2"
unicode-normalization = "=0.1.25"

# -- curl-cookies ------------------------------------------------------------
psl = "=2.1.223"
publicsuffix = "=2.3.0"

# -- curl-tls : C backend adapters -------------------------------------------
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
# default-features off; six features enabled.                          DL-0038
mbedtls = { version = "=0.13.5", default-features = false, features = ["std", "time", "ssl", "x509", "aesni", "padlock"] }   # DL-0018 DL-0038
wolfssl = "=7.3.0"
wolfssl-sys = "=4.3.0"
schannel = "=0.1.29"
security-framework = "=3.7.0"
core-foundation = "=0.10.1"

# -- curl-auth ---------------------------------------------------------------
libgssapi = "=0.11.0"
# default-features off: `build_bindgen` off.                            DL-0028
gsasl-sys = { version = "=0.2.4", default-features = false }          # DL-0028
base64 = "=0.23.1"
sha2 = "=0.11.0"
sha1 = "=0.11.0"
hmac = "=0.13.0"
md-5 = "=0.11.0"
md4 = "=0.11.0"

# -- curl-proto-ssh / curl-proto-ldap ----------------------------------------
libssh2-sys = "=0.3.2"                                                # DL-0019
libssh-sys = "=0.1.1"                                                 # DL-0019
# default-features off; `tls-native` off.                              DL-0009
ldap3 = { version = "=0.12.1", default-features = false, features = ["sync"] }   # DL-0009

# -- curl-abi and platform surfaces ------------------------------------------
libc = "=0.2.189"
socket2 = "=0.6.5"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
errno = "=0.3.14"

# -- curl-types and shared infrastructure ------------------------------------
once_cell = "=1.21.4"
parking_lot = "=0.12.5"
memchr = "=2.8.3"
thiserror = "=2.0.20"

# -- curl-core observability : unconditional, never feature-gated ------------
tracing = "=0.1.44"

# -- build dependencies ------------------------------------------------------
cc = "=1.4.2"
pkg-config = "=0.3.33"
cbindgen = "=0.29.4"
# Generates the committed binding skeletons.                          DL-0013
bindgen = "=0.72.1"

# -- testing/ : verification tree only ---------------------------------------
tracing-subscriber = "=0.3.23"
metrics = "=0.24.6"
# default-features off: `push-gateway` off.                             DL-0009
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }   # DL-0009
axum = "=0.8.9"
tracing-opentelemetry = "=0.33.0"
opentelemetry = "=0.32.0"
criterion = "=0.8.2"
proptest = "=1.11.0"
arbitrary = "=1.4.2"
assert_cmd = "=2.2.2"
tempfile = "=3.27.0"
pretty_assertions = "=1.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
hex = "=0.4.3"
blake3 = "=1.8.6"

# ---------------------------------------------------------------------------
# Profiles. `panic = "abort"` must never appear in any profile.        DL-0008
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 0
debug = 2
panic = "unwind"                                                      # DL-0008

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"                                                      # DL-0008
debug = false
strip = "none"
incremental = false

# Release code generation plus full DWARF.                             DL-0021
[profile.abi]
inherits = "release"
debug = 2                                                             # DL-0021
strip = "none"
split-debuginfo = "off"

[profile.bench]
inherits = "release"
debug = 1

# ---------------------------------------------------------------------------
# Project contract; Cargo ignores [workspace.metadata].               DL-0026
# Read by the root Makefile, the shim and CI.                          DL-0026
# ---------------------------------------------------------------------------
[workspace.metadata.curl]
baseline-tag = "curl-8_21_0"                                          # DL-0001
msrv = "1.97.1"
artifact-packages = ["curl-abi", "curl-cli"]

# Frozen at import; never renamed, never extended.                       [R12]
# `make verify CONFIG=<name>` arguments; case-sensitive.                 [R12]
feature-configurations = ["default", "minimal", "full", "rustls-only", "OpenSSL-only"]
default-configuration = "default"

# Completeness contract only; confers no membership.                   DL-0026
# Counts are derived from this list, never restated.                   DL-0026
required-members = [
  # -- refactor/ : ABI, core, shared leaves --
  "refactor/curl-abi",
  "refactor/curl-core",
  "refactor/curl-types",                                              # DL-0003
  "refactor/curl-rt",                                                 # DL-0002
  "refactor/curl-pingpong",                                           # DL-0004

  # -- refactor/ : subsystem crates --
  "refactor/curl-url",
  "refactor/curl-dns",
  "refactor/curl-tls",
  "refactor/curl-http1",                                              # DL-0018
  "refactor/curl-http2",
  "refactor/curl-http3",
  "refactor/curl-auth",
  "refactor/curl-cookies",

  # -- refactor/ : one crate per baseline protocol --
  "refactor/curl-proto-ftp",
  "refactor/curl-proto-smtp",
  "refactor/curl-proto-imap",
  "refactor/curl-proto-pop3",
  "refactor/curl-proto-rtsp",
  "refactor/curl-proto-tftp",
  "refactor/curl-proto-smb",
  "refactor/curl-proto-ldap",
  "refactor/curl-proto-telnet",
  "refactor/curl-proto-gopher",
  "refactor/curl-proto-dict",
  "refactor/curl-proto-mqtt",
  "refactor/curl-proto-file",
  "refactor/curl-proto-ws",
  "refactor/curl-proto-ssh",                                          # DL-0005
  "refactor/curl-proto-rtmp",                                         # DL-0005

  # -- refactor/ : the command-line tool --
  "refactor/curl-cli",

  # -- refactor/ : allowlisted unsafe adapter crates --                 DL-0011
  "refactor/curl-tls-gnutls",                                         # DL-0013
  "refactor/curl-idn-libidn2",                                        # DL-0013
  "refactor/curl-idn-winidn",                                         # DL-0013
  "refactor/curl-idn-apple",                                          # DL-0013
  "refactor/curl-psl-libpsl",                                         # DL-0013
  "refactor/curl-rtmp-librtmp",                                       # DL-0013
  "refactor/curl-ldap-openldap",                                      # DL-0013
  "refactor/curl-auth-gsasl",
  "refactor/curl-ssh-libssh2",                                        # DL-0019
  "refactor/curl-ssh-libssh",                                         # DL-0019
  "refactor/curl-alloc",                                              # DL-0015

  # -- testing/ : all project-authored verification --
  "testing/differential",
  "testing/perf",
  "testing/upstream-suite",
  "testing/integration",
  "testing/equivalence",                                              # DL-0006
  "testing/fuzz",
  "testing/corpora",
  "testing/audit",
  "testing/audit/traceability",
  "testing/abi",
  "testing/observability",
]
unsafe-allowlist = [                                                  # DL-0011
  "curl-abi",
  "curl-tls-gnutls",
  "curl-idn-libidn2",
  "curl-idn-winidn",
  "curl-idn-apple",
  "curl-psl-libpsl",
  "curl-rtmp-librtmp",
  "curl-ldap-openldap",
  "curl-auth-gsasl",
  "curl-ssh-libssh2",
  "curl-ssh-libssh",
  "curl-alloc",
]

# Invariants the resolved graph must satisfy.                          DL-0036
# Asserted by testing/audit; zero matches and empty graphs fail.       DL-0036
[workspace.metadata.curl.resolved-invariants]
asserted-by = "testing/audit"                                         # DL-0037
# Assertion target of the full-set invariants below.                   DL-0036
full-set-source = "re-derived-resolution-of-workspace-dependencies"   # DL-0036
single-version-package = "rustls"                                     # DL-0010
distinct-rustls-versions = 1                                          # DL-0010
crypto-provider = "ring"                                              # DL-0009
absent-transitives = ["aws-lc-rs", "aws-lc-sys", "native-tls"]        # DL-0009
# Recorded transitive release set; asserted name by version.          DL-0009
recorded-transitives = { ring = "0.17.14", rustls-webpki = "0.103.13", rustls-pki-types = "1.15.1", rustls-platform-verifier = "0.7.0", quinn-proto = "0.11.16", http = "1.5.0", tokio = "1.53.1", tokio-util = "0.7.19", bytes = "1.12.1" }   # DL-0009
# Asserted per target with `cargo tree -i`.                            DL-0018
absent-from-target-graph = ["chrono", "time"]                         # DL-0018
target-graph = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

# The five build configurations, each warning-clean.                     [R12]
# `args` is appended to `cargo build` and `cargo clippy`.                [R12]
[workspace.metadata.curl.configurations.default]
args = []
[workspace.metadata.curl.configurations.minimal]
args = ["--no-default-features"]
[workspace.metadata.curl.configurations.full]
args = ["--all-features"]
[workspace.metadata.curl.configurations.rustls-only]
args = ["--no-default-features", "--features", "curl-abi/rustls-only,curl-cli/rustls-only"]
# Name is `OpenSSL-only`; the feature is lowercase.                      [R12]
[workspace.metadata.curl.configurations.OpenSSL-only]
args = ["--no-default-features", "--features", "curl-abi/openssl-only,curl-cli/openssl-only"]

# Aggregate features the artifact packages must define.                  [R12]
[workspace.metadata.curl.required-artifact-features]
curl-abi = ["rustls-only", "openssl-only"]
curl-cli = ["rustls-only", "openssl-only"]

# Mapping class of every baseline flag and CMake option.               DL-0016
# Per-flag table: refactor/docs/FEATURE-MAP.md.                        DL-0016
[workspace.metadata.curl.flag-classes]
capability = { becomes-cargo-feature = true }                         # DL-0016
backend-selection = { becomes-cargo-feature = true }                  # DL-0016
value-or-path = { becomes-cargo-feature = false, consumed-by = "shim" }            # DL-0016
test-infrastructure = { becomes-cargo-feature = false, consumed-by = "staging-wrapper" }   # DL-0016
accepted-and-inert = { becomes-cargo-feature = false, consumed-by = "shim" }       # DL-0016

# Torture mode; the shim maps the flag below.                          DL-0014
[workspace.metadata.curl.debug-build]
baseline-flag = "--enable-debug"
feature = "debug"                                                     # DL-0014
owning-crate = "curl-alloc"                                           # DL-0015
provides = ["alloc-failure-injection", "leak-accounting"]

# The `default` feature set; a frozen forward contract.                DL-0026
# Derived mechanically from `source`.                                  DL-0026
[workspace.metadata.curl.default-features]
source = "original/configure.ac"                                      # DL-0026
derivation = "baseline capability defaults with a TLS backend selected and every optional library detected"   # DL-0026
# The `rustls` entry is a recorded deviation.                          DL-0030
tls-selection = { baseline = "explicit-choice-required", baseline-locator = "original/configure.ac:519-523", baseline-default-flag = "OPT_RUSTLS=no@original/configure.ac:299", project-default = "rustls", deviation = "DL-0030" }
features = [                                                          # DL-0026
  "alt-svc",
  "aws",
  "basic-auth",
  "bearer-auth",
  "bindlocal",
  "brotli",
  "ca-search",
  "cookies",
  "dateparse",
  "dict",
  "digest-auth",
  "dnsshuffle",
  "doh",
  "file",
  "form-api",
  "ftp",
  "get-easy-options",
  "gopher",
  "headers-api",
  "hsts",
  "http",
  "http-auth",
  "http2",
  "idn",
  "imap",
  "ipfs",
  "ipv6",
  "kerberos-auth",
  "ldap",
  "ldaps",
  "libcurl-option",
  "mime",
  "mqtt",
  "negotiate-auth",
  "netrc",
  "ntlm",
  "pop3",
  "progress-meter",
  "proxy",
  "psl",
  "rtsp",
  "rustls",
  "sha512-256",
  "smb",
  "smtp",
  "socketpair",
  "telnet",
  "tftp",
  "threaded-resolver",
  "tls-srp",
  "unix-sockets",
  "verbose",
  "websockets",
  "zlib",
  "zstd",
]

# Where a plan premise and the pinned oracle disagree.                 DL-0035
# Verified by testing/audit; the oracle governs.                       DL-0001
[workspace.metadata.curl.baseline-premise]
asserted-by = "testing/audit"                                         # DL-0037
vocabulary = [                                                        # DL-0035
  "absorbed-upstream",
  "constants-and-symbols-only",
  "project-owned-out-of-tree",
  "vendored-at-tag-path",
]

# RTMP left the baseline in 8.20.0.                                    DL-0035
[workspace.metadata.curl.baseline-premise-deltas.librtmp]
plan-premise = "librtmp discovery module, --with-librtmp flag and an RTMP translation unit"
absent-paths = [
  "original/CMake/FindLibrtmp.cmake",
  "original/lib/curl_rtmp.c",
]
present-paths = [
  "original/include/curl/curl.h",
  "original/lib/version.c",
]
evidence = [
  { path = "original/docs/DEPRECATE.md", line = 82, contains = "RTMP (removed in 8.20.0)" },
  { path = "original/docs/libcurl/symbols-in-versions", line = 977, contains = "CURLPROTO_RTMP                  7.21.0        8.20.0" },
  { path = "original/include/curl/curl.h", line = 1097, contains = "#define CURLPROTO_RTMP" },
  { path = "original/lib/version.c", line = 574, contains = "rtmp version" },
  { path = "original/Makefile.am", line = 29, contains = "CMAKE_DIST =" },
  { path = "original/Makefile.am", line = 44, contains = "CMake/FindLibssh2.cmake" },
  { path = "original/lib/Makefile.inc", line = 154, contains = "LIB_CFILES =" },
  { path = "original/lib/Makefile.inc", line = 147, contains = "vssh/libssh2.c" },
]
delivered = "constants-and-symbols-only"                              # DL-0035
flag-contract = "accepted-and-inert"                                  # DL-0016
decision = "DL-0035"

# The tag's bootstrap contract is `autoreconf -fi`.                    DL-0033
[workspace.metadata.curl.baseline-premise-deltas.buildconf]
plan-premise = "original/buildconf as the baseline bootstrap entry point, mode 100755"
absent-paths = ["original/buildconf"]
present-paths = [
  "original/GIT-INFO.md",
  "testing/upstream-suite/baseline-bootstrap",
]
evidence = [
  { path = "original/GIT-INFO.md", line = 21, contains = "autoreconf -fi" },
  { path = "original/tests/testcurl.pl", line = 54, contains = "Do not run autoreconf -fi" },
]
delivered = "project-owned-out-of-tree"                               # DL-0033
flag-contract = "none"
decision = "DL-0033"

# Upstream moved this tooling to scripts/ before the tag.              DL-0034
[workspace.metadata.curl.baseline-premise-deltas.badwords-script]
plan-premise = "original/.github/scripts/badwords.pl and badwords.txt"
absent-paths = [
  "original/.github/scripts/badwords.pl",
  "original/.github/scripts/badwords.txt",
]
present-paths = [
  "original/scripts/badwords",
  "original/scripts/badwords-all",
  "original/scripts/badwords.txt",
]
evidence = [
  { path = "original/scripts/badwords-all", line = 13, contains = "exit system('scripts/badwords', ('scripts/badwords.txt'," },
  { path = "original/Makefile.am", line = 175, contains = "scripts/badwords-all" },
  { path = "original/CMakeLists.txt", line = 577, contains = "scripts/badwords-all" },
]
delivered = "vendored-at-tag-path"                                    # DL-0034
flag-contract = "none"
decision = "DL-0034"

# The .ok allowlist now lives inside badwords.txt.                     DL-0034
[workspace.metadata.curl.baseline-premise-deltas.badwords-allowlist]
plan-premise = "original/.github/scripts/badwords.ok as a separate allowlist file"
absent-paths = [
  "original/.github/scripts/badwords.ok",
  "original/scripts/badwords.ok",
]
present-paths = ["original/scripts/badwords.txt"]
evidence = [
  { path = "original/scripts/badwords.txt", line = 8, contains = "# ---[word]" },
  { path = "original/scripts/badwords", line = 14, contains = "# ---(accepted word)" },
  { path = "original/scripts/badwords", line = 184, contains = "if(/^---:([^:]*):(.*)/)" },
]
delivered = "absorbed-upstream"                                       # DL-0034
flag-contract = "none"
decision = "DL-0034"

# The noproxy unit is absorbed into proxy.c at the tag.                DL-0050
[workspace.metadata.curl.baseline-premise-deltas.noproxy-header]
plan-premise = "original/lib/noproxy.h and noproxy.c declaring Curl_check_noproxy and two CIDR matchers"
absent-paths = [
  "original/lib/noproxy.c",
  "original/lib/noproxy.h",
]
present-paths = [
  "original/lib/proxy.c",
  "original/lib/proxy.h",
  "original/tests/unit/unit1614.c",
]
evidence = [
  { path = "original/lib/proxy.c", line = 197, contains = "UNITTEST bool proxy_check_noproxy(const char *name, const char *no_proxy);" },
  { path = "original/lib/proxy.c", line = 511, contains = "do_not_proxy = proxy_check_noproxy(data->state.origin->hostname" },
  { path = "original/lib/proxy.c", line = 53, contains = "UNITTEST bool cidr4_match(" },
  { path = "original/lib/proxy.c", line = 90, contains = "UNITTEST bool cidr6_match(" },
  { path = "original/lib/proxy.h", line = 54, contains = "CURLcode Curl_proxy_init_conn(struct Curl_easy *data," },
  { path = "original/lib/Makefile.inc", line = 253, contains = "  proxy.c " },
  { path = "original/lib/Makefile.inc", line = 388, contains = "  proxy.h " },
  { path = "original/tests/unit/unit1614.c", line = 25, contains = "proxy.h" },
  { path = "original/tests/unit/unit1614.c", line = 159, contains = "cidr4_match(list4[i].a, list4[i].n, list4[i].bits)" },
]
delivered = "absorbed-upstream"                                       # DL-0050
flag-contract = "none"
decision = "DL-0050"

# Comment discipline in project-authored configuration files.          DL-0032
# Enforced by testing/audit; the decision log holds every "why".       DL-0023
[workspace.metadata.curl.comment-discipline]
decision-log = "refactor/docs/DECISION-LOG.md"                        # DL-0023
asserted-by = "testing/audit"                                         # DL-0037
# Every root *.toml, root .gitignore and member manifest.              DL-0032
files = [
  ".gitignore",
  "Cargo.toml",
  "rust-toolchain.toml",
  "testing/audit/Cargo.toml",
  "testing/upstream-suite/baseline-bootstrap",
]
max-label-words = 10                                                  # DL-0032
max-label-chars = 76                                                  # DL-0032
max-block-lines = 2                                                   # DL-0032
marker-keys = ["MIRI-TOOLCHAIN", "MIRI-COMPONENTS"]                   # DL-0029
banned-phrases = [                                                    # DL-0032
  "as a result",
  "because",
  "consequently",
  "for this reason",
  "in order to",
  "instead of",
  "otherwise",
  "rather than",
  "so that",
  "the reason",
  "therefore",
  "which is why",
]
