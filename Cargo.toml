# =============================================================================
# curl-rs — root Cargo workspace manifest
# =============================================================================
#
# This is the net-new workspace manifest for the in-place C -> Rust migration of
# curl 8.19.0-DEV (Agent Action Plan §0.4 / §0.5). It defines a three-crate
# workspace that produces a drop-in `curl` binary and a `libcurl`-compatible
# shared/static library, targeting functional parity with curl 8.x. There is no
# C-source equivalent for this file; it is pure scaffolding mandated by the
# AAP's three-crate, `cbindgen`, and `cargo-deny` requirements.
#
# Crates and their strict dependency direction (AAP §0.4):
#   * curl-rs-lib  — the core async library (engine, protocols, TLS, conn, auth,
#                    dns, util). Memory-safe; `#![forbid(unsafe_code)]` at its
#                    protocol/tls/transfer module roots (AAP §0.7.1).
#   * curl-rs      — the binary CLI crate (clap), a drop-in `curl`.
#                    Depends on curl-rs-lib only.
#   * curl-rs-ffi  — the FFI crate exposing the `extern "C"` libcurl ABI, built
#                    as `cdylib` + `staticlib`. Depends on curl-rs-lib only.
# The two leaf crates (curl-rs, curl-rs-ffi) NEVER depend on each other.
#
# `Cargo.lock` is generated by Cargo and committed by the build — it is never
# hand-authored here.
# =============================================================================

[workspace]
# Exactly the three crate directories that make up the workspace. These member
# directories are materialized by the crate-scaffolding steps of the migration;
# this manifest must not block their resolution.
members = ["curl-rs-lib", "curl-rs", "curl-rs-ffi"]

# Resolver v2 is required for a virtual workspace (there is no root package to
# infer the edition-implied resolver from) and gives per-target / per-profile
# feature resolution, which the four-target CI matrix (AAP §0.8.1) relies on.
resolver = "2"

# -----------------------------------------------------------------------------
# Fields shared by every member crate. Members inherit these with
# `version.workspace = true`, `edition.workspace = true`, etc.
# -----------------------------------------------------------------------------
[workspace.package]
# Version aligns with the curl baseline taken from include/curl/curlver.h:
#   LIBCURL_VERSION      "8.19.0-DEV"
#   LIBCURL_VERSION_NUM  0x081300   (MAJOR=8, MINOR=19, PATCH=0)
#
# NOTE: Cargo's SemVer `version` field cannot carry curl's "-DEV" pre-release
# marker the way the C macro LIBCURL_VERSION does (a literal "8.19.0-DEV" here
# would be interpreted as a SemVer pre-release and would sort *below* "8.19.0").
# The human-facing version string reported by `curl_version()` and
# `curl --version` ("8.19.0-DEV") is owned by curl-rs-lib's version module, not
# by this field.
version = "8.19.0"

# Edition and MSRV per AAP §0.8.1 (consistent with the committed
# rust-toolchain.toml, which pins the stable channel).
edition = "2021"
rust-version = "1.75"

# curl's own SPDX license identifier (matches `SPDX-License-Identifier: curl`
# in include/curl/*.h).
license = "curl"

authors = ["Daniel Stenberg <daniel@haxx.se>", "curl-rs contributors"]
repository = "https://github.com/curl/curl"
homepage = "https://curl.se/"
description = "A memory-safe Rust rewrite of curl/libcurl with curl 8.x functional parity"

# These crates are an in-place, drop-in replacement for the `curl` binary and
# the `libcurl` shared/static library; they are built and installed locally and
# are NOT intended for publication to crates.io. Marking them unpublished is
# both accurate and required for the `[licenses.private] ignore = true` policy
# in deny.toml to take effect: cargo-deny only treats a workspace crate as
# "private" (and thus exempt from the third-party license allow-list) when its
# `publish` field is `false`. Without this, `cargo deny check licenses` rejects
# the workspace's own `license = "curl"` crates even though third-party deps
# are still fully gated by the allow-list. Members opt in via
# `publish.workspace = true`.
publish = false

# -----------------------------------------------------------------------------
# [workspace.dependencies] — shared, EXACT dependency pins (AAP §0.6.1).
#
# Member crates opt in via `<dep>.workspace = true` and extend the feature set
# locally (e.g. `tokio = { workspace = true, features = ["rt", "net"] }`);
# features declared on a workspace dependency are additive with those a member
# requests. The default feature set is kept minimal and parity-driven so that
# `curl --version` capability reporting matches curl's default build
# (AAP §0.6.2).
#
# All versions are EXACT pins per the minimal-change / no-`latest` mandate
# (AAP §0.8.1, §0.8.3) — never `latest`, never a bare `*`.
#
# rustls 0.23.36 was web-search-validated (AAP §0.8.3) as a current, valid
# release on the 0.23.x stable line. rustls is the EXCLUSIVE TLS backend: no
# OpenSSL, native-tls, or any other C-TLS crate appears anywhere in this
# workspace (AAP §0.8.1; enforced by the committed deny.toml).
# -----------------------------------------------------------------------------
[workspace.dependencies]

# ---- internal crates -------------------------------------------------------
# Lets curl-rs and curl-rs-ffi depend on the core with `curl-rs-lib.workspace = true`.
curl-rs-lib = { path = "curl-rs-lib", version = "=8.19.0" }

# ---- async runtime & I/O ---------------------------------------------------
tokio = "=1.52.3"
tokio-util = "=0.7.18"
bytes = "=1.12.0"
futures-util = "=0.3.32"
pin-project-lite = "=0.2.17"
socket2 = "=0.5.10"

# ---- HTTP/1.1 + HTTP/2 -----------------------------------------------------
hyper = "=1.10.1"
hyper-util = "=0.1.20"
http = "=1.4.2"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
h2 = "=0.4.15"

# ---- HTTP/3 + QUIC ---------------------------------------------------------
# quinn's DEFAULT feature set includes `platform-verifier`, which transitively
# pulls rustls-platform-verifier -> rustls-native-certs -> the OS
# certificate-store crates (openssl-probe on Linux, schannel on Windows,
# security-framework/-sys on macOS/iOS). Those crates are banned by deny.toml
# and violate the AAP §0.8.1 rustls-exclusive / "no C TLS dependency path"
# rule (Rules-Compliance #3/#7). curl-rs sources its trust anchors EXCLUSIVELY
# from `webpki-roots` (declared below), matching the AAP §0.6.1 root-store
# design, so `platform-verifier` is disabled here. Every other upstream
# default feature is preserved verbatim — `log`, `runtime-tokio`,
# `rustls-ring`, `bloom` — and the AAP §0.6.1 version pin (0.11.9) is unchanged.
quinn = { version = "=0.11.9", default-features = false, features = ["log", "runtime-tokio", "rustls-ring", "bloom"] }
h3 = "=0.0.7"
h3-quinn = "=0.0.10"

# ---- TLS (exclusive backend: rustls) ---------------------------------------
# EXACT pin (AAP §0.6.1/§0.8.1/§0.8.3): `=0.23.36` makes Cargo.lock resolve
# exactly this version, so the advertised TLS-backend version
# (crate::tls::RUSTLS_VERSION / crate::version::SSL_VERSION = "rustls/0.23.36")
# matches the compiled crate byte-for-byte. Without the `=`, the caret `^0.23.36`
# silently resolved a newer patch (0.23.40), contradicting the reported version.
rustls = "=0.23.36"
tokio-rustls = "=0.26.4"
rustls-pki-types = "=1.14.1"
webpki-roots = "=1.0.8"
# `rustls-pemfile` was REMOVED (RUSTSEC-2025-0134: the crate is unmaintained —
# its repository was archived). Its certs / CRLs / private-key / public-key PEM
# decoders are superseded by the `PemObject` trait in `rustls-pki-types` (the
# maintained successor, already a workspace dependency and re-exported as
# `rustls::pki_types`), which provides byte-identical decoding semantics:
# `CertificateDer::pem_slice_iter`, `CertificateRevocationListDer::pem_slice_iter`,
# `PrivateKeyDer::from_pem_slice` (matches PKCS#8/PKCS#1/SEC1, exactly like the
# old `private_key`), and `SubjectPublicKeyInfoDer::pem_slice_iter`. See
# `curl-rs-lib/src/tls/config.rs`.

# ---- SSH transport: SFTP / SCP (replaces libssh / libssh2) -----------------
# DOCUMENTED EXCEPTION (AAP §0.8.3) to the AAP §0.6.1 pins (russh 0.54.6,
# russh-sftp 2.1.1, russh-keys 0.49.2), required by an empirically verified,
# unrecoverable upstream defect:
#
#   russh 0.54.6 is UNINSTALLABLE — its required transitive dependency
#   `libcrux-ml-kem 0.0.3` has been YANKED from crates.io, so dependency
#   resolution fails outright (verified: `cargo metadata` reports
#   "failed to select a version for the requirement libcrux-ml-kem = ^0.0.3;
#   version 0.0.3 is yanked ... required by russh v0.54.6"). It is likewise
#   absent from this build's pre-warmed offline crate cache, so it cannot be
#   fetched or compiled here under any configuration.
#
# Per the validated setup log, russh >= 0.60.3 resolves cleanly and additionally
# clears two HIGH-severity advisories; 0.61.2 is the validated pin and is used
# here. russh-sftp tracks to 2.3.0 with this line (verified to co-resolve).
#
# The standalone `russh-keys` crate (0.49.x, built for the russh 0.54.x line) is
# DROPPED: SSH key handling is provided by the `russh::keys` module in
# russh 0.61.x (verified: `pub mod keys;`). Adding the old standalone crate
# alongside russh 0.61.x would pull a duplicate, API-incompatible key stack.
#
# PRECEDENCE (why this exception is mandatory, not discretionary): AAP §0.8.1
# makes a clean `cargo build --release --workspace` (zero warnings, on all four
# targets) the BINARY success condition for the entire migration, and the
# `russh`/`russh-sftp` crates are real, compiled dependencies of `curl-rs-lib`.
# Pinning russh 0.54.6 makes that build IMPOSSIBLE (the yanked transitive dep
# above), which would fail the §0.8.1 gate. When the §0.6.1 version literal and
# the §0.8.1 success condition cannot both be honored, the success condition
# controls, and §0.8.3 explicitly authorizes recording the deviation as a
# Cargo.toml comment — which is what this block does.
#
# >>> AAP AMENDMENT REQUESTED (raised here per the code-review resolution
#     guidance to "obtain an AAP amendment before deviating"): amend AAP §0.6.1
#     SSH pins to `russh 0.61.2`, `russh-sftp 2.3.0`, and remove `russh-keys`
#     (superseded by `russh::keys`). This comment stands as the deviation record
#     until that amendment lands; the pins below MUST NOT be reverted to the
#     uninstallable 0.54.x line.
russh = "=0.61.2"
russh-sftp = "=2.3.0"

# ---- DNS (optional async resolver; feature-gated OFF by default, AAP §0.6.2) -
# SECURITY UPGRADE (supersedes the AAP §0.6.1 pin `=0.25.2`): hickory-proto 0.25.2
# is affected by two RustSec advisories — RUSTSEC-2026-0118 (NSEC3 closest-encloser
# unbounded loop; `unaffected = ">= 0.26.0-beta.1"`) and RUSTSEC-2026-0119
# (O(n^2) name-compression CPU exhaustion; `patched = ">= 0.26.1"`). hickory-resolver
# 0.26.1 pulls hickory-proto >= 0.26.1, clearing BOTH, and resolves cleanly from the
# offline cache. AAP §0.8.1 makes "zero unresolved advisories" a binary security gate,
# so the fixed release controls over the §0.6.1 literal (§0.8.3 authorizes recording
# such a deviation as a Cargo.toml comment).
#
# >>> AAP AMENDMENT REQUESTED: amend AAP §0.6.1 DNS pin to `hickory-resolver 0.26.1`.
#     This comment stands as the deviation record until that amendment lands; the pin
#     below MUST NOT be reverted to the advisory-affected 0.25.2 line.
hickory-resolver = "=0.26.1"

# ---- CLI -------------------------------------------------------------------
clap = "=4.6.1"
clap_complete = "=4.6.5"

# ---- FFI -------------------------------------------------------------------
libc = "=0.2.186"
# `cbindgen` is a BUILD-dependency of curl-rs-ffi (it generates
# include/curl/curl.h from the FFI crate's `extern "C"` items). It is declared
# here so the FFI crate can reference it as `cbindgen.workspace = true` under
# its own [build-dependencies] table.
cbindgen = "=0.29.4"
# `cc` is a BUILD-dependency of curl-rs-ffi: it compiles the tiny C ABI
# trampolines under `curl-rs-ffi/csrc/*.c` that bridge calling conventions
# stable Rust cannot express — the C-variadic / `va_list` printf family
# (`curl_mprintf` & friends) and the variadic `curl_easy_setopt` /
# `curl_easy_getinfo` / `curl_multi_setopt` / `curl_formadd` shims (AAP §0.7.2).
# This is the documented no-C-mandate exception (AAP §0.8.2/§0.8.3): the
# trampolines forward to the platform C library only and link NO third-party C
# library (no TLS/protocol backend). Pinned to the version already present in
# Cargo.lock (a transitive build dep of aws-lc-sys / ring / zstd-sys), so adding
# it here introduces no lockfile churn. Referenced as `cc.workspace = true`
# under curl-rs-ffi's [build-dependencies].
cc = "=1.2.64"

# ---- crypto / auth (NTLM, Digest, SASL, SCRAM) -----------------------------
sha2 = "=0.10.9"
md-5 = "=0.10.6"
md4 = "=0.10.2"
hmac = "=0.12.1"
des = "=0.8.1"
base64 = "=0.22.1"
rand = "=0.8.6"

# ---- content-encoding (gzip/deflate, Brotli, Zstandard) --------------------
flate2 = "=1.1.9"
brotli = "=8.0.4"
zstd = "=0.13.3"

# ---- serialization (--write-out JSON, config) ------------------------------
serde = "=1.0.228"
serde_json = "=1.0.150"

# ---- URL / IDN / PSL -------------------------------------------------------
url = "=2.5.8"
percent-encoding = "=2.3.2"
idna = "=1.1.0"
publicsuffix = "=2.3.0"

# ---- misc (URL globbing, dates, structured logging) ------------------------
glob = "=0.3.3"
chrono = "=0.4.45"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

# ---- error handling --------------------------------------------------------
thiserror = "=2.0.18"
anyhow = "=1.0.102"

# ---- dev / test (shared across crates' [dev-dependencies]) -----------------
rcgen = "=0.14.8"
tokio-test = "=0.4.5"
tempfile = "=3.27.0"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

# -----------------------------------------------------------------------------
# Release profile. The minimal-change mandate (AAP §0.8.1) forbids gratuitous
# optimization, so this stays close to Cargo defaults: `opt-level = 3` is the
# release default (set explicitly for clarity), and `lto = "thin"` enables mild
# cross-crate inlining for the shipped drop-in artifacts without the heavy build
# cost (or aggressiveness) of fat LTO. No exotic tuning is applied. This profile
# applies workspace-wide because this is a virtual (package-less) manifest root.
# -----------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "thin"

# -----------------------------------------------------------------------------
# Workspace-wide lint policy (supports the memory-safety mandate, AAP §0.7.1).
#
# Member crates opt in with:
#     [lints]
#     workspace = true
#
# IMPORTANT: `unsafe_code` is deliberately NOT forbidden here. The FFI crate
# (curl-rs-ffi) legitimately requires `unsafe` for the `extern "C"` boundary, so
# a workspace-wide `forbid(unsafe_code)` would be incorrect. Memory safety is
# instead enforced *locally*: curl-rs-lib applies `#![forbid(unsafe_code)]` at
# the roots of its protocol/, tls/, and transfer modules, and every `unsafe`
# block in curl-rs-ffi carries a `// SAFETY:` comment.
#
# The lint below applies safely to all three crates and is a no-op in the safe
# ones: it requires every unsafe operation inside an `unsafe fn` to sit in an
# explicit `unsafe { }` block, keeping the FFI surface auditable. (Stable since
# Rust 1.52; allow-by-default under edition 2021, hence set explicitly.)
# -----------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
